# cargo-fuzz targets for Nugget's untrusted-input parsers. See README.md.
#
# Its own cargo workspace (the empty `[workspace]` below), not a member of the root one: it needs
# nightly and libFuzzer, and it has its own lockfile. The parser crates come in by path, so a
# fuzz run always tests the checked-out code.
[package]
name = "nugget-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"
# No OCR: the mail and calendar extractors are what is fuzzed here.
nugget-extract = { path = "../crates/nugget-extract", default-features = false }
nugget-ipc = { path = "../crates/nugget-ipc" }
nugget-models = { path = "../crates/nugget-models" }
nugget-plugin = { path = "../crates/nugget-plugin" }
url = "2"
# plugin_package: restates the package hashes; plugin_caps: writes manifest TOML strings.
hex = "0.4"
serde_json = "1"
sha2 = "0.11"

# Run with `cargo fuzz run -O` (see README.md): without `-O`, cargo-fuzz adds `-Cdebug-assertions`
# to RUSTFLAGS for every crate. Debug assertions and overflow checks catch more bugs, but only in
# our own crates, set here: third-party `debug_assert!`s (mail-parser 0.11 has a
# `debug_assert!(false)` on malformed nested multipart) are no-ops in shipped builds and would
# stop every run on the same non-bug.
[profile.release]
debug = 1

[profile.release.package.nugget-core]
debug-assertions = true
overflow-checks = true

[profile.release.package.nugget-extract]
debug-assertions = true
overflow-checks = true

[profile.release.package.nugget-ipc]
debug-assertions = true
overflow-checks = true

[profile.release.package.nugget-models]
debug-assertions = true
overflow-checks = true

[profile.release.package.nugget-plugin]
debug-assertions = true
overflow-checks = true

[[bin]]
name = "mail"
path = "fuzz_targets/mail.rs"
test = false
doc = false
bench = false

[[bin]]
name = "calendar"
path = "fuzz_targets/calendar.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ipc_frame"
path = "fuzz_targets/ipc_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "model_manifest"
path = "fuzz_targets/model_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_manifest"
path = "fuzz_targets/plugin_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_package"
path = "fuzz_targets/plugin_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_caps"
path = "fuzz_targets/plugin_caps.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plugin_fs_path"
path = "fuzz_targets/plugin_fs_path.rs"
test = false
doc = false
bench = false
