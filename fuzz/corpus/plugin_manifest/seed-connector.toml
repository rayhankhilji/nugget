id = "dev.example.fuzz.feeds"
name = "Feeds"
version = "0.1.0"
description = "Reads one feed."
kind = ["connector", "tool"]

[capabilities]
hosts = ["feeds.example.com", "*.cdn.example.com", "http://127.0.0.1:8080", "https://[::1]:8443"]
secrets = ["api_token"]
kv_max_bytes = 4096

[connector]
display_name = "Feed"
auth = "password"
poll_interval_secs = 1800

[connector.settings_schema]
type = "object"
required = ["url"]
