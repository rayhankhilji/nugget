[package]
name = "nugget-obsidian"
description = "Nugget plugin: import an Obsidian vault's notes, with front matter, tags and links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
nugget-plugin-sdk.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile = "3"
