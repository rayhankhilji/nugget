[package]
name = "nugget-ingest"
description = "Ingest runtime for Nugget: source registry, per-source supervisors and the indexing pipeline"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nugget-core.workspace = true
nugget-connector.workspace = true
nugget-extract.workspace = true
nugget-store.workspace = true
nugget-infer.workspace = true
async-trait.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
toml = "1"

# OS keychains for source credentials. The backend set must match nugget-store's and
# nugget-infer's exactly; see the `keyring` entry in the root Cargo.toml.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }
# IOKit power sources for the power policy (CoreFoundation types).
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
# GetSystemPowerStatus for the power policy.
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
