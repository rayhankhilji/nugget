[package]
name = "nugget-store"
description = "Encrypted local store for Nugget: items, chunks, search, cursors, egress ledger, audit log, knowledge graph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nugget-core.workspace = true
nugget-graph.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
time.workspace = true
tracing.workspace = true
# SQLCipher (SQLite + AES-256) built from source with a vendored OpenSSL, so every OS gets the same,
# encrypted engine. The bundled build enables FTS5.
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl"] }
sqlite-vec = "0.1.6"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
getrandom = "0.3"
# Liveness locks of egress ledger owners (same crate as the daemon lock in nugget-ipc).
fs4 = "1"
zeroize = "1"
# Backup key envelope: passphrase KDF and AEAD.
argon2 = "0.5"
chacha20poly1305 = "0.10"

# OS keychains. Each target only pulls in its native backend; anything else falls back to a key file.
# The backend set must match nugget-infer's exactly; see the `keyring` entry in the root Cargo.toml.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
# Protected DACLs on the data directory and key file (same version as nugget-ipc).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

# Secret Service over a pure-Rust D-Bus client (zbus), so there is no libdbus system dependency.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
