[package]
name = "nugget-cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Nugget Cloud service: auth check, Composio connections and ingest, AI gateway, cloud Ask."
publish = false

[dependencies]
nugget-core.workspace = true
nugget-store.workspace = true
nugget-retrieve.workspace = true
# M2/M3 intelligence: reused as libraries over a per-user snapshot (see `snapshot`).
nugget-knowledge.workspace = true
nugget-proactive.workspace = true
nugget-ingest.workspace = true
nugget-infer.workspace = true
nugget-graph.workspace = true
futures.workspace = true
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
nugget-policy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
time = { workspace = true, features = ["macros"] }
reqwest = { workspace = true, features = ["json", "query", "form", "stream"] }
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "query", "tokio", "matched-path"] }
# Postgres over rustls with the workspace's single crypto provider (aws-lc-rs), no `ring`.
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-time-0_3", "with-serde_json-1"] }
deadpool-postgres = "0.14"
tokio-postgres-rustls = { version = "0.14", features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-platform-verifier = "0.7"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.11"
hmac = "0.13"
base64 = "0.23"
url = "2"
toml = "1"
hex = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7", default-features = false, features = ["cors"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# The self-hosting smoke example drives the server with the desktop's own client.
nugget-cloud-client.workspace = true
wiremock = "0.6"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[lints]
workspace = true
