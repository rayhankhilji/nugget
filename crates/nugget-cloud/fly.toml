# Fly.io app for nugget-cloud. Deploy from the repository root:
#   fly deploy --config crates/nugget-cloud/fly.toml --dockerfile crates/nugget-cloud/Dockerfile
# Secrets (fly secrets set ...): DATABASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY, COMPOSIO_API_KEY, COMPOSIO_AUTH_CONFIGS, ANTHROPIC_API_KEY,
# optionally OPENAI_API_KEY, COMPOSIO_WEBHOOK_SECRET, DATABASE_CA_CERT, SENTRY_DSN.
# Ops knobs (env, not secret): see docs/ops/runbook.md.
app = "nugget-cloud"
primary_region = "lhr"
# SIGTERM, then this long to drain (the service gives in-flight work NUGGET_SHUTDOWN_GRACE_SECS).
kill_signal = "SIGTERM"
kill_timeout = 30

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the sync loop runs in-process.
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    # Readiness: the database answers. /healthz is liveness only.
    path = "/readyz"
    interval = "30s"
    timeout = "5s"

# Prometheus text from the internal metrics listener (NUGGET_METRICS_BIND, not public).
[metrics]
  port = 9091
  path = "/metrics"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
