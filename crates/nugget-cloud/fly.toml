# Fly.io app for nugget-cloud. Deploy from the repository root:
#   fly deploy --config crates/nugget-cloud/fly.toml --dockerfile crates/nugget-cloud/Dockerfile
# Secrets (fly secrets set ...): DATABASE_URL, SUPABASE_URL, SUPABASE_ANON_KEY,
# SUPABASE_SERVICE_ROLE_KEY, COMPOSIO_API_KEY, COMPOSIO_AUTH_CONFIGS, ANTHROPIC_API_KEY,
# optionally OPENAI_API_KEY, COMPOSIO_WEBHOOK_SECRET, DATABASE_CA_CERT.
app = "nugget-cloud"
primary_region = "lhr"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: the sync loop runs in-process.
  auto_stop_machines = "off"
  min_machines_running = 1

  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
