[package]
name = "feed-reader"
description = "Example Nugget plugin: an RSS/Atom feed connector and a headlines tool"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
nugget-plugin-sdk.workspace = true
roxmltree = "0.21"
time = { version = "0.3", default-features = false, features = ["parsing", "std"] }
