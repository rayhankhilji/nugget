[package]
name = "nugget-plugin"
description = "WebAssembly plugin runtime for community connectors and tools: WIT world, capability-checked host, signed packages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# The guest SDK and the example plugins are a separate cargo workspace built for wasm32-wasip2.
exclude = ["sdk/target"]

[dependencies]
nugget-core.workspace = true
nugget-connector.workspace = true
nugget-agent.workspace = true
nugget-policy.workspace = true
async-trait.workspace = true
ed25519-dalek = "3"
futures.workspace = true
getrandom = "0.4"
hex = "0.4"
reqwest.workspace = true
semver = { version = "1", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
time.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
tracing.workspace = true
url = "2"
# The 36.x LTS line (security fixes backported; rust-version 1.86). 37+ non-LTS releases up to the
# workspace MSRV (38.x) carry unpatched RustSec advisories, and 39+ needs Rust 1.89. Keep >= 36.0.19.
# Apache-2.0 WITH LLVM-exception. No WASI: plugins get only the nugget:plugin host imports.
wasmtime = { version = "36.0.20", default-features = false, features = [
    "async",
    "component-model",
    "cranelift",
    "parallel-compilation",
    "runtime",
    "std",
] }

[dev-dependencies]
tempfile = "3"
wat = "1"
wiremock = "0.6"

[lints]
workspace = true
