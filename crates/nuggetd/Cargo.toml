[package]
name = "nuggetd"
description = "Nugget background daemon: encrypted store, model providers and local IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# The daemon is a binary; the library target exists so integration tests can run it in-process.
[lib]
path = "src/lib.rs"

[[bin]]
name = "nuggetd"
path = "src/main.rs"

# Test double for llama.cpp's `llama-server` (nugget-runtime's), built only for this crate's own
# tests through the self dev-dependency below, so the end-to-end tests can run the local runtime.
[[bin]]
name = "nuggetd-fake-llama-server"
path = "../nugget-runtime/src/bin/fake-llama-server.rs"
required-features = ["fake-runtime"]
test = false
doc = false

[features]
fake-runtime = []

[dependencies]
nugget-core.workspace = true
nugget-store.workspace = true
nugget-infer.workspace = true
nugget-models.workspace = true
nugget-ipc.workspace = true
nugget-connector.workspace = true
nugget-connector-files.workspace = true
nugget-connector-google.workspace = true
nugget-connector-imap.workspace = true
nugget-connector-caldav.workspace = true
nugget-connector-microsoft.workspace = true
nugget-connector-saas.workspace = true
nugget-ingest.workspace = true
nugget-retrieve.workspace = true
nugget-runtime.workspace = true
nugget-graph.workspace = true
nugget-knowledge.workspace = true
nugget-vault.workspace = true
nugget-mcp.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
time.workspace = true
clap = { version = "4.6", features = ["derive"] }
toml = "1"
tokio-util = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
nuggetd = { path = ".", version = "0.0.1", features = ["fake-runtime"] }
base64 = "0.22"
tempfile = "3"
wiremock = "0.6"
# The MCP SDK's own client, to talk to the daemon's MCP server over HTTP and the stdio bridge.
rmcp = { version = "3.8.0", default-features = false, features = [
    "client",
    "transport-io",
    "transport-streamable-http-client-reqwest",
] }
reqwest = { workspace = true, features = ["json"] }

[lints]
workspace = true
