[package]
name = "nugget-connector-caldav"
description = "CalDAV calendar connector for Nugget (RFC 6578 sync-collection with ETag fallback)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nugget-core.workspace = true
nugget-connector.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
# Streaming XML reader: no DTD processing, no external entities. We reject DOCTYPE outright and
# resolve only the five predefined entities and character references.
quick-xml = "0.42"

[dev-dependencies]
nugget-connector = { workspace = true, features = ["testkit"] }
wiremock = "0.6"

[lints]
workspace = true
