[package]
name = "nugget-a11y"
description = "Cross-platform accessibility: read the focused field and thread, insert with read-back verification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nugget-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# AT-SPI 2 over zbus (pure Rust D-Bus); the blocking API runs on zbus' own executor thread.
atspi = { version = "0.30", default-features = false, features = ["proxies", "zbus"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
# Clipboard fallback: X11 selections + XTest paste (pure Rust protocol), and Wayland.
x11rb = { version = "0.14", features = ["xtest"] }
wl-clipboard-rs = "0.9"

[lints]
workspace = true
