[package]
name = "nugget-infer"
description = "One provider layer for every model, local or cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Sign in with ChatGPT (`chatgpt` module): ChatGPT plan usage for LOCAL mode only. Only nuggetd
# enables it; the hosted service (`nugget-cloud`, built alone with `-p nugget-cloud`) never
# compiles it in (OpenAI's open-source programme covers locally run apps, not hosted ones).
chatgpt-plan = ["dep:aws-lc-rs"]

[dependencies]
nugget-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
time.workspace = true
async-stream = "0.3"
base64 = "0.22"
# RS256 ID-token checks, PKCE and random state for Sign in with ChatGPT: the workspace provider.
aws-lc-rs = { version = "1", optional = true }
bytes = "1"
png = "0.18"
toml = "1"
url = "2"
# Wraps reqwest's connector to time connection setup (same versions reqwest already uses).
tower-layer = "0.3"
tower-service = "0.3"
# TLS stack and features come from the workspace (rustls + aws-lc-rs, OS certificate verifier).
reqwest = { workspace = true, features = ["stream"] }

# OS keychain for `keychain:NAME` API keys. The backend set must match nugget-store's exactly;
# see the `keyring` entry in the root Cargo.toml for the per-OS choice.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "async-io", "crypto-rust"] }

[dev-dependencies]
# The crate's own tests cover the optional Sign in with ChatGPT module too.
nugget-infer = { path = ".", features = ["chatgpt-plan"] }
wiremock = "0.6"
tokio = { workspace = true }

[lints]
workspace = true
