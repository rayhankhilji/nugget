[package]
name = "nugget-infer"
description = "One provider layer for every model, local or cloud"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
nugget-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
tracing.workspace = true
async-trait.workspace = true
futures.workspace = true
time.workspace = true
async-stream = "0.3"
base64 = "0.22"
bytes = "1"
png = "0.18"
toml = "1"
url = "2"
# rustls on `ring` (Apache-2.0/ISC) with the OS trust store; no OpenSSL, no aws-lc build step.
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls-native-roots",
    "http2",
    "stream",
] }
# Only the pure-Rust platform stores. A Secret Service backend (sync *or* async) may be enabled
# by another crate in the workspace; we never enable one ourselves so features cannot conflict.
keyring = { version = "3.6", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true }

[lints]
workspace = true
