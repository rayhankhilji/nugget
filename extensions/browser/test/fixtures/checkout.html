<!doctype html>
<html>
  <head><title>Checkout</title></head>
  <body>
    <form id="pay">
      <input name="cardnumber" autocomplete="cc-number" value="4111111111111111" aria-label="Card number" />
      <input name="cvc" value="123" aria-label="CVC" />
      <input id="exp" name="exp-date" placeholder="MM/YY" value="12/30" />
      <input name="card_holder" autocomplete="cc-name" value="Ada L" aria-label="Name on card" />
      <input name="iban" value="DE89370400440532013000" aria-label="IBAN" />
      <input name="coupon" value="SAVE10" aria-label="Coupon" />
      <button type="submit">Pay $20.00</button>
    </form>
  </body>
</html>
