# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Monthly, one grouped PR per ecosystem at most, to stay inside the GitHub Free Actions minutes
# (CONTRIBUTING.md, "CI on the free tier"). Pull requests do not run CI by themselves; check one
# with `gh workflow run ci.yml --ref <dependabot branch>` before merging. Security updates are
# separate (repository settings) and not limited by this file.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
