# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Monthly, one grouped PR per ecosystem at most, to keep the PR and CI noise down. ci.yml, e2e.yml and
# docs.yml run on each Dependabot PR. Security updates are separate (repository settings) and not
# limited by this file.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
