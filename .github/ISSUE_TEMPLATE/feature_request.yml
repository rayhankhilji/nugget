name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like Nugget to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and safety
      description: Does this send data off the device, touch credentials, or act on the user's behalf? How should it be consented to, recorded or confirmed?
  - type: checkboxes
    id: clean-room
    attributes:
      label: Clean room
      options:
        - label: This request does not include code, prompts or text copied from Sentient OS or other AGPL software.
          required: true
