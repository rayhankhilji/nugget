name: HH2 GG6-1 before/after (real 4B, Linux onboarding)

# Re-verifies QA GG6-1 (docs/qa/GG6.md on qa/first-week): with the recommended local model
# installed, onboarding's "First source" step (the 24-file corpus in qa/GG6/real-os/corpus) took
# 474 s on Linux before "Search works now", because ingest triaged every file with the LLM before
# indexing it. This job runs GG6's own harness (qa/GG6/real-os/run-bridge.mjs, read from QA commit
# e1eb203 at run time, not copied into this branch) twice on one ubuntu-22.04 runner: BEFORE is
# nuggetd + frontend at `before_ref` (GG6 re-checked ea3f86c), AFTER is this commit. Each run gets
# a fresh Nugget home, a real model download, and its own frontend build and e2e bridge.
# Results: the step summary (qa/HH2/gg6_compare.py) and the hh2-gg6-<run id> artifact.

on:
  # TEMPORARY: the workflow is not on the default branch yet, so it cannot be dispatched;
  # remove before the final push.
  push:
    branches: [hh/ingest-triage]
    paths:
      - ".github/workflows/hh2-gg6.yml"
  workflow_dispatch:
    inputs:
      before_ref:
        description: "Commit for the BEFORE build (nuggetd and frontend)"
        default: ea3f86c
        type: string
      soak_minutes:
        description: "0 = onboarding + day-1 chat only (--days none). >0 = also GG6's days 2-7 with this soak"
        default: "0"
        type: string
      index_timeout_min:
        description: "Minutes the source step may take before GG6's check gives up (GG6's own value is 10)"
        default: "30"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # A release build like the dry-run bundle GG6 installed (release.yml: dry runs trust the dev
  # manifest key, which signs manifests/default.json). option_env!, so it matters at build time.
  NUGGET_TRUST_DEV_MANIFEST_KEY: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  NO_COLOR: "1"
  BEFORE_REF: ${{ inputs.before_ref || 'ea3f86c' }}
  SOAK_MIN: ${{ inputs.soak_minutes || '0' }}
  INDEX_TIMEOUT_MIN: ${{ inputs.index_timeout_min || '30' }}
  # The QA commit holding the GG6 harness (qa/GG6/real-os/).
  GG6_REF: e1eb20363764e6a6af8da3bdfd8488c5541eea55
  OUT: ${{ github.workspace }}/hh2-gg6-out

jobs:
  gg6:
    name: GG6 first source before/after (Linux, real 4B)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve refs, extract the GG6 harness from the QA commit
        run: |
          git cat-file -e "$GG6_REF^{commit}" 2>/dev/null || git fetch --no-tags origin qa/first-week
          git cat-file -e "$GG6_REF^{commit}"
          before=$(git rev-parse --verify "$BEFORE_REF^{commit}")
          echo "BEFORE_SHA=$before" >> "$GITHUB_ENV"
          mkdir -p "$OUT" "$RUNNER_TEMP/gg6"
          # Only qa/GG6/real-os is needed: run-bridge.mjs imports ../../../apps/desktop/e2e/{bridge,daemon}.mjs
          # and tauri-shim.js, lib.mjs reads apps/desktop/src/i18n/locales/en.json and Playwright
          # comes from apps/desktop/node_modules. Those come from each tree under test (below).
          git archive "$GG6_REF" qa/GG6/real-os | tar -x -C "$RUNNER_TEMP/gg6"
          # The one change to GG6's harness: the source step's timeout (GG6: 10 min), so a slow
          # BEFORE gives a number rather than ">600 s". Fail loudly if the line moved.
          j="$RUNNER_TEMP/gg6/qa/GG6/real-os/journey.mjs"
          grep -q 'indexTimeoutMs = 10 \* 60_000' "$j"
          if [ "$INDEX_TIMEOUT_MIN" != "10" ]; then
            sed -i "s/indexTimeoutMs = 10 \* 60_000/indexTimeoutMs = $INDEX_TIMEOUT_MIN * 60_000/" "$j"
            grep -n "indexTimeoutMs = $INDEX_TIMEOUT_MIN \* 60_000" "$j"
          fi
          find "$RUNNER_TEMP/gg6" -name '*.mjs' | sort

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hh2-gg6

      # BEFORE in a worktree with its own target dir: cargo decides freshness by mtimes, and a
      # shared target dir let AFTER reuse BEFORE's binary once (hh2-ingest run 41197266492).
      - name: Build nuggetd BEFORE (${{ env.BEFORE_REF }})
        run: |
          git worktree add --detach "$RUNNER_TEMP/before-src" "$BEFORE_SHA"
          cargo build --release --locked -p nuggetd \
            --manifest-path "$RUNNER_TEMP/before-src/Cargo.toml" --target-dir "$RUNNER_TEMP/before-target"
          mkdir -p "$RUNNER_TEMP/bin"
          cp "$RUNNER_TEMP/before-target/release/nuggetd" "$RUNNER_TEMP/bin/nuggetd-before"
          rm -rf "$RUNNER_TEMP/before-target"

      - name: Build nuggetd AFTER (${{ github.sha }})
        run: |
          cargo build --release --locked -p nuggetd
          cp target/release/nuggetd "$RUNNER_TEMP/bin/nuggetd-after"
          if cmp -s "$RUNNER_TEMP/bin/nuggetd-before" "$RUNNER_TEMP/bin/nuggetd-after"; then
            echo "::error::BEFORE and AFTER binaries are identical"; exit 1
          fi
          sha256sum "$RUNNER_TEMP"/bin/* | tee "$OUT/binaries.txt"

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # As GG6 does, once per tree: the bridge serves <tree>/apps/desktop/dist next to the
      # e2e/bridge.mjs it is loaded from, so each nuggetd gets the frontend and bridge of its own commit.
      - name: Frontend and Playwright, BEFORE tree
        working-directory: ${{ runner.temp }}/before-src/apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Frontend and Playwright, AFTER tree
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium

      # The harness must sit at <tree>/qa/GG6/real-os for its relative imports. These copies are
      # untracked files in the runner's checkouts only; nothing is committed.
      - name: Place the harness in both trees
        id: place
        run: |
          for tree in "$RUNNER_TEMP/before-src" "$GITHUB_WORKSPACE"; do
            if [ -e "$tree/qa/GG6/real-os" ]; then echo "::error::$tree already has qa/GG6/real-os"; exit 1; fi
            mkdir -p "$tree/qa/GG6"
            cp -r "$RUNNER_TEMP/gg6/qa/GG6/real-os" "$tree/qa/GG6/"
          done

      - name: Record hardware
        run: |
          {
            echo "runner: ${{ runner.name }} (${{ runner.os }} ${{ runner.arch }})"
            echo "before: $BEFORE_REF ($BEFORE_SHA)"
            echo "after: ${{ github.sha }}"
            echo "gg6 harness: $GG6_REF (source-step timeout ${INDEX_TIMEOUT_MIN} min)"
            echo "soak minutes: $SOAK_MIN"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            lscpu
            free -g
            df -h "$HOME" /tmp
          } | tee "$OUT/hardware.txt"

      # --days none: onboarding (welcome, "On this device", install the recommended model for
      # real, add the corpus folder, wait for "Search works now", permissions, Double Tap, done),
      # the first search, and day 1's 10 chat questions. A soak > 0 also runs days 2-7.
      - name: Run BEFORE
        run: |
          if [ "$SOAK_MIN" = "0" ]; then days=(--days none); else days=(--days all --soak-min "$SOAK_MIN"); fi
          cd "$RUNNER_TEMP/before-src"
          GG6_OUT="$OUT/before" node qa/GG6/real-os/run-bridge.mjs --nuggetd "$RUNNER_TEMP/bin/nuggetd-before" "${days[@]}" 2>&1 | tee "$OUT/before.console.txt"

      # Nothing from BEFORE may share the CPU with AFTER (a model server left running), and its
      # 2.5 GB home (under /tmp/gg6-*) goes, so AFTER downloads the model into a fresh home too.
      - name: Clean up after BEFORE
        if: always()
        run: |
          { echo "== still running after BEFORE"; ps -eo pid,rss,etime,comm | grep -Ei 'nuggetd|llama' || true; } | tee "$OUT/before-leftovers.txt"
          pkill -x nuggetd || true; pkill -x llama-server || true; sleep 3
          pkill -9 -x nuggetd || true; pkill -9 -x llama-server || true
          rm -rf /tmp/gg6-*
          df -h /tmp

      - name: Run AFTER
        if: ${{ !cancelled() && steps.place.outcome == 'success' }}
        run: |
          if [ "$SOAK_MIN" = "0" ]; then days=(--days none); else days=(--days all --soak-min "$SOAK_MIN"); fi
          GG6_OUT="$OUT/after" node qa/GG6/real-os/run-bridge.mjs --nuggetd "$RUNNER_TEMP/bin/nuggetd-after" "${days[@]}" 2>&1 | tee "$OUT/after.console.txt"
          { echo "== still running after AFTER"; ps -eo pid,rss,etime,comm | grep -Ei 'nuggetd|llama' || true; } | tee "$OUT/after-leftovers.txt"
          pkill -x nuggetd || true; pkill -x llama-server || true

      - name: Compare
        if: always()
        run: |
          python3 qa/HH2/gg6_compare.py "$OUT/before" "$OUT/after" --hardware "$OUT/hardware.txt" \
            --labels "before ${BEFORE_SHA:0:7}" "after ${GITHUB_SHA:0:7}" --out "$OUT/compare.md"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh2-gg6-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
