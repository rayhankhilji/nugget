name: Plugins

# Builds the plugin SDK workspace (crates/nugget-plugin/sdk: the SDK, the example plugins and the
# hostile test plugin) for wasm32-wasip2, then runs the nugget-plugin host tests with the guests
# required, so a missing target cannot turn the guest tests into silent skips. Then builds the
# first-party plugins (plugins/build.sh), signs them with a throwaway key made in the job, installs
# them through the daemon's catalog and install flow, and uploads the signed packages.

on:
  push:
    branches: [main]
    paths:
      - "crates/nugget-plugin/**"
      - "crates/nuggetd/src/features/plugins.rs"
      - "plugins/**"
      - ".github/workflows/plugins.yml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/nugget-plugin/**"
      - "crates/nuggetd/src/features/plugins.rs"
      - "plugins/**"
      - ".github/workflows/plugins.yml"
      - "Cargo.lock"
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: short

jobs:
  plugins:
    name: Plugin guests and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The host tests build the guests into <target>/plugin-guests (see
      # crates/nugget-plugin/src/tests/mod.rs); building them there first makes that a no-op.
      GUEST_TARGET_DIR: ${{ github.workspace }}/target/plugin-guests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the channel; the guests also need the wasm32-wasip2 target.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup target add wasm32-wasip2

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/nugget-plugin/sdk -> ../../../target/plugin-guests
            plugins -> ../target/plugins
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The SDK workspace is separate from the root one, so the root fmt/clippy runs miss it.
      - name: cargo fmt (sdk)
        working-directory: crates/nugget-plugin/sdk
        run: cargo fmt --all --check

      - name: cargo clippy (sdk, wasm32-wasip2)
        working-directory: crates/nugget-plugin/sdk
        env:
          CARGO_TARGET_DIR: ${{ env.GUEST_TARGET_DIR }}
        run: cargo clippy --locked --release --workspace --target wasm32-wasip2 -- -D warnings

      - name: Build plugin guests (release, wasm32-wasip2)
        working-directory: crates/nugget-plugin/sdk
        env:
          CARGO_TARGET_DIR: ${{ env.GUEST_TARGET_DIR }}
        run: |
          cargo build --locked --release --workspace --target wasm32-wasip2
          ls -l "$CARGO_TARGET_DIR/wasm32-wasip2/release/"*.wasm

      - name: cargo test -p nugget-plugin
        env:
          NUGGET_PLUGIN_REQUIRE_GUESTS: "1"
        run: cargo test --locked -p nugget-plugin

      # The key exists only in this step's shell: it is masked, never written to disk or to
      # $GITHUB_ENV, and dies with the job. The packages it signs are for CI only; a user trusts
      # them only by adding the printed public key to [plugins] trusted_keys.
      - name: Build, sign and install the first-party plugins (throwaway key)
        env:
          OUT_DIR: ${{ github.workspace }}/target/first-party-plugins
        run: |
          set -euo pipefail
          NUGGET_PLUGIN_SIGNING_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$NUGGET_PLUGIN_SIGNING_KEY"
          export NUGGET_PLUGIN_SIGNING_KEY
          rm -rf "$OUT_DIR"
          # Builds the SDK examples and plugins/{rss,obsidian,read-later}, signs each into
          # $OUT_DIR/<id>.nuggetplugin.
          CARGO_FLAGS=--locked bash plugins/build.sh --out "$OUT_DIR"
          ls -l "$OUT_DIR"/*.nuggetplugin
          # Installs every signed package from a catalog dir through plugins.catalog,
          # plugins.install and plugins.approve, with the throwaway public key trusted.
          NUGGET_FIRST_PARTY_PLUGINS="$OUT_DIR" \
            cargo test --locked -p nuggetd --lib \
            features::plugins::tests::first_party_plugins_install_from_the_catalog \
            -- --exact --nocapture
          unset NUGGET_PLUGIN_SIGNING_KEY

      - name: Upload the signed first-party plugins
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: first-party-plugins
          path: target/first-party-plugins/*.nuggetplugin
          if-no-files-found: error
          retention-days: 14
