name: HH2 triage prompt variants (real 4B, JJ1 corpus sample)

# JJ1-1 experiment: labels a sample of JJ1's triage corpus (every planted sensitive
# and junk mail plus 40 normal mails per language) with each triage prompt/schema variant in
# qa/HH2/triage_prompts.py, on the daemon's own chat llama-server and model (qa/HH2/serve_chat.py).

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGGET_TRUST_DEV_MANIFEST_KEY: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  NO_COLOR: "1"
  CHAT_MODEL: qwen3-4b-q4km
  JJ1_REF: 2cfd68290a08976aa8fe2faee7c5a812092a8dd4
  OUT: ${{ github.workspace }}/hh2-prompts-out

jobs:
  prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: JJ1 harness and corpus
        run: |
          git fetch --no-tags origin qa/wave-ii
          mkdir -p "$OUT" "$RUNNER_TEMP/jj1"
          git archive "$JJ1_REF" qa/JJ1/harness qa/JJ1/triage | tar -x -C "$RUNNER_TEMP/jj1"
          python3 "$RUNNER_TEMP/jj1/qa/JJ1/triage/gen_corpus.py" --out "$RUNNER_TEMP/corpus" --n 1200

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hh2-jj1

      - name: Cache models and runtime
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models-cache
          key: qa-jj1-models-${{ env.CHAT_MODEL }}-${{ hashFiles('manifests/default.json') }}

      - name: Build nuggetd
        run: cargo build --release --locked -p nuggetd

      - name: Serve the chat model
        run: |
          lscpu | grep -E "Model name|^CPU\(s\)" | tee "$OUT/hardware.txt"
          python3 qa/HH2/serve_chat.py --harness "$RUNNER_TEMP/jj1/qa/JJ1/harness" \
            --nuggetd target/release/nuggetd --home "$RUNNER_TEMP/home" --chat-model "$CHAT_MODEL" \
            --models-cache "$RUNNER_TEMP/models-cache" --port 18080 --log "$OUT/llama-server.log"

      - name: Variants
        run: |
          python3 qa/HH2/triage_prompts.py --server http://127.0.0.1:18080 \
            --corpus "$RUNNER_TEMP/corpus" --out "$OUT" | tee "$OUT/console.txt"
          cat "$OUT/prompts.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hh2-prompts-${{ github.run_id }}
          path: ${{ env.OUT }}
          retention-days: 14
