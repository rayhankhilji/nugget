name: CI (weekly, all OSes)

# The parts of the old every-push CI matrix that ci.yml no longer runs: clippy and the
# platform-sensitive tests on macOS and Windows, the desktop app on macOS and Windows, MSRV, and
# bench smoke on all three OSes. fmt, cargo-deny, DCO and the Linux clippy/tests/desktop are in
# ci.yml and are not repeated here. Weekly and on demand:
#   gh workflow run ci-weekly.yml --ref <branch>

on:
  # Weekly, Sunday 03:43 UTC.
  schedule:
    - cron: "43 3 * * 0"
  workflow_dispatch:

# Least privilege: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"

jobs:
  # macOS and Windows clippy every crate (cheap: check-mode builds) but test only the crates with
  # per-OS code paths (paths, permissions, keychain, sockets/pipes, process supervision, hotkeys,
  # accessibility, file watching); the rest is pure Rust whose behaviour does not depend on the
  # OS, and ci.yml tests all of it on Linux. nugget-desktop needs the webview system libraries and
  # a built frontend, so the desktop job covers it.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      PLATFORM_CRATES: >-
        -p nugget-core -p nugget-store -p nugget-ipc -p nugget-runtime -p nugget-infer
        -p nugget-models -p nugget-hotkey -p nugget-a11y -p nuggetd -p nugget-vault
        -p nugget-voice -p nugget-ingest -p nugget-connector-files
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the channel and components; this makes sure they are present.
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      # SQLCipher's vendored OpenSSL needs a Windows-native Perl; Git's MSYS Perl breaks its build.
      - name: Use Strawberry Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $perl) { "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      # NASM for the x86_64 assembly in vendored OpenSSL (openssl-src) and aws-lc-sys. Both can
      # fall back without it, but with it the build is the same one release.yml ships.
      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/claude/inspiring-wozniak-z3gg3n' || github.ref == 'refs/heads/main' }}

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets --exclude nugget-desktop --keep-going -- -D warnings

      - name: cargo test (platform-sensitive crates)
        shell: bash
        run: |
          # shellcheck disable=SC2086 # PLATFORM_CRATES is a list of `-p` flags and must word-split.
          cargo test --locked $PLATFORM_CRATES

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # `cargo +1.88` overrides the stable channel pinned in rust-toolchain.toml. Keep the version
      # in step with `rust-version` in the root Cargo.toml.
      - name: Install Rust 1.88
        run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-msrv
          save-if: ${{ github.ref == 'refs/heads/claude/inspiring-wozniak-z3gg3n' || github.ref == 'refs/heads/main' }}
      # nugget-desktop is left out for the same reason as in the rust job (webview libraries, built
      # frontend); it has no MSRV-sensitive code of its own beyond what its dependencies check.
      - name: cargo check
        run: cargo +1.88 check --locked --workspace --all-targets --exclude nugget-desktop

  bench:
    name: Bench smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Use Strawberry Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $perl) { "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/claude/inspiring-wozniak-z3gg3n' || github.ref == 'refs/heads/main' }}

      # `all` includes `knowledge` (the real M2 pipeline on the fixture corpus, about 2 s).
      - name: Bench smoke run
        shell: bash
        run: cargo run --locked -p nugget-bench -- all --scale smoke --out-dir "$RUNNER_TEMP/bench-results"

      # The M2 knowledge targets are gates: a missed target fails the job.
      - name: Bench knowledge (strict)
        shell: bash
        run: cargo run --locked -p nugget-bench -- knowledge --strict --out-dir "$RUNNER_TEMP/bench-results"

      # The real stack in process (encrypted store, ingest, files watcher, retriever): about 15 s
      # at smoke scale on a debug build. A failed run fails the job; target verdicts are in the
      # report (no --strict: at smoke scale the recall gate can tie its baseline).
      - name: Bench memory, real backend (smoke)
        if: runner.os == 'Linux'
        shell: bash
        run: cargo run --locked -p nugget-bench -- memory --backend real --scale smoke --out-dir "$RUNNER_TEMP/bench-results"

      - name: Validate bench reports against the schema
        if: runner.os == 'Linux'
        shell: bash
        run: pipx run check-jsonschema --schemafile bench/schema/report.schema.json "$RUNNER_TEMP"/bench-results/*.json

      - name: Upload bench reports
        uses: actions/upload-artifact@v4
        with:
          name: bench-smoke-${{ matrix.os }}
          path: ${{ runner.temp }}/bench-results/
          retention-days: 14
          if-no-files-found: error

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy

      - name: Use Strawberry Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $perl) { "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - uses: ilammy/setup-nasm@v1
        if: runner.os == 'Windows'

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/claude/inspiring-wozniak-z3gg3n' || github.ref == 'refs/heads/main' }}

      # The pnpm version comes from `packageManager` in apps/desktop/package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Build frontend
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # Unit and component tests (vitest). `--if-present` keeps this step valid while the test
      # scripts change; UI tests that need a browser belong under their own script.
      - name: Frontend tests
        working-directory: apps/desktop
        run: pnpm run --if-present test

      - name: cargo clippy (desktop)
        run: cargo clippy --locked -p nugget-desktop --all-targets -- -D warnings

      - name: cargo build (desktop)
        run: cargo build --locked -p nugget-desktop

      - name: cargo test (desktop)
        run: cargo test --locked -p nugget-desktop
