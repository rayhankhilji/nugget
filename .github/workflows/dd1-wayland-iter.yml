name: DD1 Wayland iteration (temporary)
on:
  push:
    branches: [dd/wayland-shortcut]
    paths:
      - ".github/workflows/dd1-wayland-iter.yml"
      - "tests/fixtures/native/linux/**"
permissions:
  contents: read
jobs:
  infra:
    name: infra (${{ matrix.compositor }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compositor: [kwin, gnome]
    env:
      NUGGET_WAYLAND_COMPOSITOR: ${{ matrix.compositor }}
      NUGGET_WAYLAND_LOGS: ${{ github.workspace }}/wayland-artifacts
      NUGGET_WAYLAND_DBUS_MONITOR: "1"
      NUGGET_WAYLAND_MUTTER_DEBUG: keybindings,input
      NUGGET_WAYLAND_GNOME_PORTAL_DEBUG: all
      NUGGET_WAYLAND_KWIN_LOGGING: "kwin_core.debug=true;KWIN_UTILS.debug=true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Install
        run: |
          common="dbus dbus-bin libglib2.0-bin at-spi2-core xdg-desktop-portal python3-gi gir1.2-atspi-2.0 libgl1-mesa-dri libegl1"
          if [ "${{ matrix.compositor }}" = kwin ]; then
            extra="kwin-wayland xdg-desktop-portal-kde qt6-wayland"
          else
            extra="gnome-shell mutter xdg-desktop-portal-gnome gnome-control-center dconf-service"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends $common $extra
          if [ "${{ matrix.compositor }}" = kwin ]; then
            for q in qml6-module-org-kde-kirigami qml6-module-org-kde-kcmutils qml6-module-org-kde-kquickcontrols \
                     qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-templates \
                     qml6-module-qtqml-workerscript qml6-module-qtquick-window qml6-module-qtquick \
                     qml6-module-org-kde-ki18n qml6-module-qt5compat-graphicaleffects; do
              sudo apt-get install -y --no-install-recommends "$q" >/dev/null 2>&1 && echo "installed $q" || echo "MISSING $q"
            done
          fi
          dpkg-query -W xdg-desktop-portal xdg-desktop-portal-kde xdg-desktop-portal-gnome kwin-wayland gnome-shell mutter gnome-control-center qt6-wayland 2>/dev/null || true
          ls /usr/libexec/ | grep -i "shortcut\|portal" || true
      - name: Portal client, consent, key press
        run: |
          mkdir -p "$NUGGET_WAYLAND_LOGS"
          tests/fixtures/native/linux/wayland-session.sh bash -c '
            set -x
            python3 tests/fixtures/native/linux/portal-shortcut-client.py --seconds 60 > "$NUGGET_WAYLAND_LOGS/client.out" 2>&1 &
            sleep 3; cat "$NUGGET_WAYLAND_LOGS/client.out"
            python3 "$NUGGET_WAYLAND_ACCEPT_DIALOG" --timeout 20 --dump; echo "accept rc=$?"
            sleep 2; cat "$NUGGET_WAYLAND_LOGS/client.out"
            if [ "$NUGGET_WAYLAND_COMPOSITOR" = gnome ]; then
              gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell --method org.freedesktop.DBus.Properties.Get org.gnome.Shell OverviewActive
              python3 "$NUGGET_WAYLAND_KEYS" super; sleep 1.5
              echo "after super:"; gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell --method org.freedesktop.DBus.Properties.Get org.gnome.Shell OverviewActive
              python3 "$NUGGET_WAYLAND_KEYS" super; sleep 1.5
              echo "after 2nd super:"; gdbus call --session --dest org.gnome.Shell --object-path /org/gnome/Shell --method org.freedesktop.DBus.Properties.Get org.gnome.Shell OverviewActive
            fi
            python3 "$NUGGET_WAYLAND_KEYS" ctrl+alt+space; echo "keys rc=$?"
            sleep 2
            python3 "$NUGGET_WAYLAND_KEYS" ctrl+alt+space
            sleep 2; cat "$NUGGET_WAYLAND_LOGS/client.out"
            grep -n -i "accelerator\|GlobalShortcuts\|Activated\|error" "$NUGGET_WAYLAND_LOGS/dbus-monitor.log" | grep -v "PropertiesChanged" | head -80 || true
            for f in "$NUGGET_WAYLAND_LOGS"/*.log; do case "$f" in *dbus-monitor*) continue;; esac; echo "=== $f"; tail -n 120 "$f"; done
            grep -q "activated double-tap" "$NUGGET_WAYLAND_LOGS/client.out"
          '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: iter-${{ matrix.compositor }}
          path: wayland-artifacts/
          if-no-files-found: ignore
