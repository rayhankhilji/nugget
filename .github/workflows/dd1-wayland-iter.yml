name: DD1 Wayland iteration (temporary)
on:
  push:
    branches: [dd/wayland-shortcut]
    paths:
      - ".github/workflows/dd1-wayland-iter.yml"
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
jobs:
  # ---- Linux Wayland ----
  # A private headless Wayland session (tests/fixtures/native/linux/wayland-session.sh): a session
  # bus, the compositor, the accessibility bus and the XDG portals, with a GTK 4 fixture app
  # running natively on Wayland (GDK_BACKEND=wayland, no XWayland). Three compositors
  # (ubuntu-latest is Ubuntu 26.04: Plasma 6.6, GNOME 50, xdg-desktop-portal 1.21):
  # - sway (wlroots headless): wlr-data-control, so the Wayland clipboard works; its portal
  #   backend (xdg-desktop-portal-wlr) has no GlobalShortcuts, so nugget-hotkey's documented
  #   "portal unavailable" error is tested (the app's fallback is in wayland-app below).
  # - kwin (kwin_wayland --virtual as root, xdg-desktop-portal-kde on the Wayland QPA) and
  # - gnome (gnome-shell --headless with a virtual monitor, xdg-desktop-portal-gnome and
  #   gnome-control-center's global shortcuts provider): GlobalShortcuts. The test registers the
  #   app id dev.nugget.Nugget (the session provides its desktop file with an existing Exec),
  #   the desktop asks for consent in its real dialog, accepted over AT-SPI as a user would,
  #   and Ctrl+Alt+Space is pressed on the compositor's virtual keyboard (KWin fake input,
  #   Mutter RemoteDesktop): the shortcut must fire through the desktop's own key handling.
  #   NUGGET_WAYLAND_EXPECT_SHORTCUT_FIRES=1 makes anything short of that a failure.
  # sway and kwin also run nugget-a11y over AT-SPI on the GTK 4 app
  # (crates/nugget-a11y/tests/linux_wayland.rs) and Double Tap's read -> draft (scripted
  # provider) -> insert -> read-back path (crates/nugget-hotkey/tests/wayland_it.rs), on kwin
  # fired by the key press. gnome runs the session and portal tests only: Mutter has no
  # data-control protocol for the Wayland clipboard the insert path uses.
  wayland:
    name: Wayland (${{ matrix.compositor }} ${{ matrix.run }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compositor: [gnome]
        run: [1, 2, 3]
    env:
      NUGGET_WAYLAND_COMPOSITOR: ${{ matrix.compositor }}
      NUGGET_WAYLAND_LOGS: ${{ github.workspace }}/wayland-artifacts
      NUGGET_WAYLAND_DBUS_MONITOR: "1"
      NUGGET_WAYLAND_GNOME_PORTAL_DEBUG: all
      NUGGET_WAYLAND_MUTTER_DEBUG: keybindings
      NUGGET_GTK4_PYTHON: /usr/bin/python3
      # KDE's and GNOME's portals implement GlobalShortcuts: fail if the session lost it, or if
      # a key press does not fire the bound shortcut.
      NUGGET_WAYLAND_EXPECT_GLOBAL_SHORTCUTS: ${{ matrix.compositor != 'sway' && '1' || '0' }}
      NUGGET_WAYLAND_EXPECT_SHORTCUT_FIRES: ${{ matrix.compositor != 'sway' && '1' || '0' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Install the Wayland session
        run: tests/fixtures/native/linux/install-wayland-session.sh "${{ matrix.compositor }}"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          key: wayland
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the tests
        run: |
          cargo test -p nugget-a11y --locked --test linux_wayland --no-run
          cargo test -p nugget-hotkey --locked --test wayland_it --no-run

      - name: AT-SPI on a GTK 4 Wayland app
        if: matrix.compositor != 'gnome'
        run: |
          mkdir -p "$NUGGET_WAYLAND_LOGS"
          tests/fixtures/native/linux/wayland-session.sh \
            cargo test -p nugget-a11y --locked --test linux_wayland -- --ignored --test-threads=1 --nocapture 2>&1 \
            | tee "$NUGGET_WAYLAND_LOGS/linux_wayland.log"
          exit "${PIPESTATUS[0]}"

      - name: Hotkey portal and Double Tap insert
        run: |
          mkdir -p "$NUGGET_WAYLAND_LOGS"
          {
            echo "### Wayland (${{ matrix.compositor }}): GlobalShortcuts portal (nugget-hotkey test process)"
            echo "| compositor | registered app id | portal session | bind | consent | activation | fired |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          hotkey="$RUNNER_TEMP/hotkey.md"
          doubletap="$RUNNER_TEMP/doubletap.md"
          : > "$hotkey"; : > "$doubletap"
          filter=()
          # The insert path needs a Wayland clipboard (data-control), which Mutter lacks.
          [ "${{ matrix.compositor }}" = gnome ] && filter=(--skip wayland_doubletap_into_gtk4)
          NUGGET_HOTKEY_SUMMARY="$hotkey" NUGGET_DOUBLETAP_SUMMARY="$doubletap" \
            tests/fixtures/native/linux/wayland-session.sh \
            cargo test -p nugget-hotkey --locked --test wayland_it -- --ignored --test-threads=1 --nocapture "${filter[@]}" 2>&1 \
            | tee "$NUGGET_WAYLAND_LOGS/wayland_it.log"
          status="${PIPESTATUS[0]}"
          cat "$hotkey" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.compositor }}" != gnome ]; then
            {
              echo
              echo "### Double Tap on Wayland (${{ matrix.compositor }}, GTK 4 text view, scripted provider, no delay)"
              echo "| OS | mode | app | read field ms | draft started ms | first token ms | first insert call ms | total ms | chunks | insert methods | verified |"
              echo "|---|---|---|---|---|---|---|---|---|---|---|"
              cat "$doubletap"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            grep -h '^DOUBLETAP-WAYLAND\|^DOUBLETAP-HOTKEY\|^DOUBLETAP-A11Y\|MANUAL STEP\|^STOP:\|accept-shortcut-dialog:\|virtual-keyboard:' "$NUGGET_WAYLAND_LOGS/wayland_it.log" | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"
          L="$NUGGET_WAYLAND_LOGS"
          grep -n "GrabAccelerator\|AcceleratorActivated\|member=Activated\|NotifyKeyboardKeycode" "$L/dbus-monitor.log" | head -40 || true
          grep -n -i "accel\|grab\|keybind" "$L/gnome-shell.log" | grep -v "^.*overlay-key" | tail -60 || true
          tail -40 "$L/portal-gnome.log" || true
          exit "$status"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: wayland-${{ matrix.compositor }}-${{ matrix.run }}
          path: wayland-artifacts/
          if-no-files-found: ignore

