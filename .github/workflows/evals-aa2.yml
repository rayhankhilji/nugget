name: Evals AA2 (temporary)

# Temporary (AA2): computer use with real local models, on push to aa/agent-quality. Removed
# before the package lands. When BASELINE is set, the same job first builds and runs that commit,
# then the pushed one, so both arms share a runner (same CPU).

on:
  push:
    branches: [aa/agent-quality]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"
  SCALE: quick
  BASELINE: "abe2f7423a7a62b7747105e81ed47eb54f098b41"
  NUGGET_BENCH_MODELS_HOME: ${{ github.workspace }}/bench/.local-models
  RESULTS: ${{ github.workspace }}/eval-results

jobs:
  eval:
    name: ${{ matrix.suite }} (real model)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: cua
            args: cua --cua-agent nugget --cua-env inproc
          - suite: cua-8b
            args: cua --cua-agent nugget --cua-env inproc --local-chat-model qwen3-8b-q4km
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: evals

      - name: Cache models and runtime
        uses: actions/cache@v4
        with:
          path: bench/.local-models/data/models
          key: local-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/default.json') }}

      - name: Build the bench
        run: |
          cargo build --release --locked -p nugget-bench
          cp target/release/nugget-bench "$RUNNER_TEMP/bench-head"
          if [ -n "$BASELINE" ]; then
            git worktree add "$RUNNER_TEMP/base" "$BASELINE"
            (cd "$RUNNER_TEMP/base" && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" \
              cargo build --release --locked -p nugget-bench)
            cp target/release/nugget-bench "$RUNNER_TEMP/bench-base"
          fi

      - name: Record hardware
        run: |
          mkdir -p "$RESULTS"
          {
            echo "suite: ${{ matrix.suite }}"
            echo "runner: ${{ runner.name }} (${{ runner.os }} ${{ runner.arch }})"
            echo "commit: ${{ github.sha }} baseline: ${BASELINE:-none}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Flags' | cut -c1-160
            free -g
          } | tee "$RESULTS/hardware-${{ matrix.suite }}.txt"

      - name: Run baseline
        if: env.BASELINE != ''
        run: |
          mkdir -p "$RESULTS/base"
          "$RUNNER_TEMP/bench-base" ${{ matrix.args }} --local-models --scale "$SCALE" \
            --out-dir "$RESULTS/base"

      - name: Run ${{ matrix.suite }}
        run: |
          mkdir -p "$RESULTS/head"
          "$RUNNER_TEMP/bench-head" ${{ matrix.args }} --local-models --scale "$SCALE" \
            --out-dir "$RESULTS/head"

      - name: Summary
        if: always()
        run: |
          for f in "$RESULTS"/*/*.json; do
            [ -e "$f" ] || continue
            echo "== $f"
            jq -c '{suite, status, git: .git_commit,
                    params: (.config.params | with_entries(select(.key | test("^(local|model|tasks|timed|sampling)")))),
                    tasks: [.config.params.task_results[]? | {id, outcome, success, steps, false_confirmations}],
                    metrics: [.metrics[] | {name, value}]}' "$f"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.suite }}
          path: |
            ${{ env.RESULTS }}
            bench/.local-models/data/logs
          if-no-files-found: warn
          retention-days: 30
