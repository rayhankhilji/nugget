name: Evals (real models)

# Real-model evaluations (bench/README.md, "Real-model results"). Every suite runs against the
# signed manifest's smallest chat and embedding models, installed and served by nugget-runtime's
# llama-server exactly as the app does (`nugget-bench --local-models`), on a CPU-only runner.
# Each suite gets its own runner so a slow one does not hold up the others; the JSON reports and
# the runner's hardware description are uploaded as artifacts. Failures and timeouts are part of
# the reports: a suite that misses a target still uploads its report.

on:
  workflow_dispatch:
    inputs:
      scale:
        description: "Workload size (smoke, quick, standard, full)"
        default: quick
        type: choice
        options: [smoke, quick, standard, full]
      chat_model:
        description: "Manifest id of the chat model (empty: the smallest)"
        default: ""
        type: string
  schedule:
    # Weekly, Monday 03:17 UTC.
    - cron: "17 3 * * 1"
  # TEMPORARY (DD4 measurement): runs the memory job only; removed before the final push.
  push:
    branches: [dd/recall-real-embedder]

# Least privilege: the job only reads the repository.
permissions:
  contents: read

concurrency:
  # TEMPORARY (DD4 measurement): "-b" lets this run go alongside the one already measuring.
  group: ${{ github.workflow }}-${{ github.ref }}-b
  cancel-in-progress: false

env:
  # Release builds trust only the release manifest key unless told otherwise (docs/release.md
  # §4). Benchmarks install models from the dev-signed bundled manifest, so opt in here; release.yml
  # does not.
  NUGGET_TRUST_DEV_MANIFEST_KEY: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"
  SCALE: ${{ inputs.scale || 'quick' }}
  CHAT_MODEL: ${{ inputs.chat_model || '' }}
  NUGGET_BENCH_MODELS_HOME: ${{ github.workspace }}/bench/.local-models
  RESULTS: ${{ github.workspace }}/eval-results

jobs:
  eval:
    name: ${{ matrix.suite }} (real model)
    # The expensive general suites run on schedule and on demand only, never on push.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: draft
            args: draft --draft-judge model --draft-dump eval-results/draft-drafts.jsonl
          - suite: cua
            args: cua --cua-agent nugget --cua-env inproc
          # The manifest's agentic-tier model, which the app routes the agent to on 16 GB.
          - suite: cua-8b
            args: cua --cua-agent nugget --cua-env inproc --local-chat-model qwen3-8b-q4km
          - suite: knowledge
            args: knowledge
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: evals

      # Models and llama-server builds, keyed by the signed manifest that pins them. The store
      # re-verifies SHA-256 on install, so a stale or corrupt cache entry is re-downloaded.
      - name: Cache models and runtime
        uses: actions/cache@v4
        with:
          path: bench/.local-models/data/models
          key: local-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/default.json') }}

      - name: Build the bench
        run: cargo build --release --locked -p nugget-bench

      - name: Record hardware
        run: |
          mkdir -p "$RESULTS"
          {
            echo "suite: ${{ matrix.suite }}"
            echo "runner: ${{ runner.name }} (${{ runner.os }} ${{ runner.arch }})"
            echo "commit: ${{ github.sha }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Flags' | cut -c1-160
            free -g
          } | tee "$RESULTS/hardware-${{ matrix.suite }}.txt"

      - name: Run ${{ matrix.suite }}
        run: |
          extra=()
          if [ -n "$CHAT_MODEL" ] && [[ "${{ matrix.args }}" != *--local-chat-model* ]]; then
            extra+=(--local-chat-model "$CHAT_MODEL")
          fi
          ./target/release/nugget-bench ${{ matrix.args }} --local-models --scale "$SCALE" \
            "${extra[@]}" --out-dir "$RESULTS"
          if [ -n "${{ matrix.args2 }}" ]; then
            ./target/release/nugget-bench ${{ matrix.args2 }} --local-models --scale "$SCALE" \
              "${extra[@]}" --out-dir "$RESULTS"
          fi

      # The metrics and the local-model parameters of every report, in the log.
      - name: Summary
        if: always()
        run: |
          for f in "$RESULTS"/*.json; do
            [ -e "$f" ] || continue
            echo "== $f"
            jq -c '{suite, status, message, duration_ms, git: .git_commit,
                    params: (.config.params | with_entries(select(.key | test("^(local|model|judge|tasks|items)")))),
                    metrics: [.metrics[] | {name, value, unit, target, target_met}]}' "$f"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.suite }}
          path: |
            ${{ env.RESULTS }}
            bench/.local-models/data/logs
          if-no-files-found: warn
          retention-days: 90

  # Double Tap latency where users are: the Linux CPU runner and Apple Silicon (the manifest's
  # Metal llama-server). Each runner runs every configuration one after the other, so all of them
  # share one CPU: the manifest's 4B chat model and the two small models proposed in
  # manifests/pending/ (bench-only, SHA-256 verified; nuggetd never reads them), each without and
  # with read-ahead. `draft-quality` measures drafting quality with each model on one runner.
  # `runs` holds one run per line: a label (the report's subdirectory of eval-results/), then the
  # bench arguments. The `chat_model` input does not apply here: every run names its model.
  doubletap:
    name: ${{ matrix.suite }} (real model)
    # TEMPORARY (DD4 measurement): not on push; removed with the push trigger.
    if: github.event_name != 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: doubletap
            os: ubuntu-latest
            runs: |
              4b-read-ahead-off doubletap --local-chat-model qwen3-4b-q4km --doubletap-read-ahead off
              4b-read-ahead-on doubletap --local-chat-model qwen3-4b-q4km --doubletap-read-ahead on
              1.7b-read-ahead-off doubletap --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-1.7b-q8 --doubletap-read-ahead off
              1.7b-read-ahead-on doubletap --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-1.7b-q8 --doubletap-read-ahead on
              0.6b-read-ahead-off doubletap --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-0.6b-q8 --doubletap-read-ahead off
              0.6b-read-ahead-on doubletap --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-0.6b-q8 --doubletap-read-ahead on
          - suite: doubletap-macos
            os: macos-latest
            runs: |
              4b-read-ahead-off doubletap --local-chat-model qwen3-4b-q4km --doubletap-read-ahead off
              4b-read-ahead-on doubletap --local-chat-model qwen3-4b-q4km --doubletap-read-ahead on
              1.7b-read-ahead-off doubletap --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-1.7b-q8 --doubletap-read-ahead off
              1.7b-read-ahead-on doubletap --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-1.7b-q8 --doubletap-read-ahead on
              0.6b-read-ahead-off doubletap --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-0.6b-q8 --doubletap-read-ahead off
              0.6b-read-ahead-on doubletap --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-0.6b-q8 --doubletap-read-ahead on
          - suite: draft-quality
            os: ubuntu-latest
            runs: |
              draft-4b draft --draft-judge model --local-chat-model qwen3-4b-q4km --draft-dump eval-results/draft-4b/drafts.jsonl
              draft-1.7b draft --draft-judge model --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-1.7b-q8 --draft-dump eval-results/draft-1.7b/drafts.jsonl
              draft-0.6b draft --draft-judge model --local-pending manifests/pending/doubletap-small.json --local-chat-model qwen3-0.6b-q8 --draft-dump eval-results/draft-0.6b/drafts.jsonl
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: evals

      # Keyed by the signed manifest and the pending entries the runs install.
      - name: Cache models and runtime
        uses: actions/cache@v4
        with:
          path: bench/.local-models/data/models
          key: local-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/default.json', 'manifests/pending/*.json') }}

      - name: Build the bench
        run: cargo build --release --locked -p nugget-bench

      - name: Record hardware
        run: |
          mkdir -p "$RESULTS"
          {
            echo "suite: ${{ matrix.suite }}"
            echo "runner: ${{ runner.name }} (${{ runner.os }} ${{ runner.arch }})"
            echo "commit: ${{ github.sha }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if [ "$RUNNER_OS" = macOS ]; then
              sysctl -n machdep.cpu.brand_string hw.ncpu hw.perflevel0.physicalcpu hw.memsize
              system_profiler SPDisplaysDataType | grep -E 'Chipset|Cores|Metal' || true
            else
              lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Flags' | cut -c1-160
              free -g
            fi
          } | tee "$RESULTS/hardware-${{ matrix.suite }}.txt"

      # Every run, in order, on this runner; one that fails does not stop the others, but fails
      # the step at the end. Each run's report goes to eval-results/<label>/.
      - name: Run ${{ matrix.suite }}
        env:
          RUNS: ${{ matrix.runs }}
        run: |
          failed=0
          while read -r -u 3 label args; do
            [ -n "$label" ] || continue
            echo "::group::$label: $args"
            mkdir -p "$RESULTS/$label"
            # Word splitting of $args is intended: it is the run's argument list.
            # shellcheck disable=SC2086
            if ! ./target/release/nugget-bench $args --local-models --scale "$SCALE" \
                --out-dir "$RESULTS/$label" < /dev/null; then
              echo "::warning::$label failed"
              failed=1
            fi
            echo "::endgroup::"
          done 3<<< "$RUNS"
          exit "$failed"

      - name: Summary
        if: always()
        run: |
          find "$RESULTS" -name '*.json' | sort | while read -r f; do
            echo "== $f"
            jq -c '{suite, status, message, duration_ms, git: .git_commit,
                    params: (.config.params | with_entries(select(.key | test("^(local|model|judge|tasks|items|draft|read_ahead|server_cpu)")))),
                    metrics: [.metrics[] | {name, value, unit, target, target_met}]}' "$f"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ matrix.suite }}
          path: |
            ${{ env.RESULTS }}
            bench/.local-models/data/logs
          if-no-files-found: warn
          retention-days: 90

  # Memory recall with the manifest's embedding model (and reranker) on the real stack
  # (`memory --backend real --local-models`), against the in-process hash embedder, every arm on
  # one runner per scale so they share a CPU. `runs` holds one run per line: a label (the
  # report's subdirectory of eval-results/), then the bench arguments. Each run also dumps the
  # target's rank per query and arm (`NUGGET_BENCH_DUMP_MISSES`) to eval-results/<label>/ranks.tsv.
  memory:
    name: memory ${{ matrix.scale }} (real embedder)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        include:
          - scale: quick
            runs: |
              hash memory --backend real
              nomic memory --backend real --local-models --memory-rerank local
          - scale: standard
            runs: |
              hash memory --backend real
              nomic memory --backend real --local-models
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: evals

      - name: Cache models and runtime
        uses: actions/cache@v4
        with:
          path: bench/.local-models/data/models
          key: local-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/default.json') }}

      - name: Build the bench
        run: cargo build --release --locked -p nugget-bench

      - name: Record hardware
        run: |
          mkdir -p "$RESULTS"
          {
            echo "suite: memory ${{ matrix.scale }}"
            echo "runner: ${{ runner.name }} (${{ runner.os }} ${{ runner.arch }})"
            echo "commit: ${{ github.sha }}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Flags' | cut -c1-160
            free -g
          } | tee "$RESULTS/hardware-memory-${{ matrix.scale }}.txt"

      # Every run, in order, on this runner; one that fails does not stop the others, but fails
      # the step at the end.
      - name: Run memory ${{ matrix.scale }}
        env:
          RUNS: ${{ matrix.runs }}
          MEMORY_SCALE: ${{ matrix.scale }}
        run: |
          failed=0
          while read -r -u 3 label args; do
            [ -n "$label" ] || continue
            echo "::group::$label: $args"
            mkdir -p "$RESULTS/$label"
            # Word splitting of $args is intended: it is the run's argument list.
            # shellcheck disable=SC2086
            if ! NUGGET_BENCH_DUMP_MISSES="$RESULTS/$label/ranks.tsv" \
                ./target/release/nugget-bench $args --scale "$MEMORY_SCALE" \
                --out-dir "$RESULTS/$label" < /dev/null; then
              echo "::warning::$label failed"
              failed=1
            fi
            echo "::endgroup::"
          done 3<<< "$RUNS"
          exit "$failed"

      - name: Summary
        if: always()
        run: |
          find "$RESULTS" -name '*.json' | sort | while read -r f; do
            echo "== $f"
            jq -c '{suite, status, message, duration_ms, git: .git_commit,
                    params: (.config.params | with_entries(select(.key | test("^(local|embed|reranker|docs|queries|retrieve)")))),
                    metrics: [.metrics[] | select(.name | test("^(retrieval\\.(hybrid|vector|bm25|hybrid_mmr|hybrid_rerank|hybrid_mmr_rerank|eval\\.[a-z_]+)\\.(recall@10|mrr@10|ndcg@10|reranked_share)|query|ingest|resources|freshness\\.p95_s|baseline\\.fake\\.retrieval\\.hybrid)")) | {name, value, target, target_met}]}' "$f"
          done
          for f in "$RESULTS"/*/ranks.tsv; do
            [ -e "$f" ] || continue
            echo "== $f"
            grep '^# hybrid@10' "$f" || true
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-memory-${{ matrix.scale }}
          path: |
            ${{ env.RESULTS }}
            bench/.local-models/data/logs
          if-no-files-found: warn
          retention-days: 90
