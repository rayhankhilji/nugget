name: CI

# Runs on every push to the integration branch and main, and on every pull request: one fast Linux
# job with fmt, cargo-deny, clippy (the workspace including the desktop crate, plus nuggetd with
# fake-runtime), the workspace tests, the desktop frontend build and vitest, and DCO sign-offs.
# Next to it on the same triggers: e2e.yml (real-app end-to-end) and docs.yml (book, links and
# bench-table checks). macOS, Windows, MSRV and bench smoke are in ci-weekly.yml; the heavy and
# real-OS suites run weekly and on demand (CONTRIBUTING.md, "CI").

on:
  push:
    branches: [claude/inspiring-wozniak-z3gg3n, main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "NOTICE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
      - "NOTICE*"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/dependabot.yml"
  workflow_dispatch:

# Least privilege: the job only reads the repository.
permissions:
  contents: read

# A newer push (or PR update) supersedes a running check of the same branch; only the newest result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"
  # No debug info in test builds: smaller target dir and cache, faster links. Backtraces still
  # carry function names.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux:
    name: Linux (fmt, clippy, tests, desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # The DCO step walks the pushed or pull-request commits.
          fetch-depth: 0
          persist-credentials: false

      - name: DCO sign-off
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # Pull request: base..head. Push: before..after. A new branch or a manual run has no
          # usable `before`; check the head commit only.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$AFTER^!"
          else
            range="$BEFORE..$AFTER"
          fi
          missing=0
          for c in $(git rev-list --no-merges "$range"); do
            email=$(git log -1 --format='%ae' "$c")
            case "$email" in
              *'[bot]@users.noreply.github.com') continue ;;
            esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$c" | grep -qiF "<$email>"; then
              echo "::error::Commit $c by <$email> has no matching 'Signed-off-by:' trailer."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with 'git commit -s' (see CONTRIBUTING.md)."
            exit 1
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo-deny (bans licenses sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check bans licenses sources

      # A new upstream advisory should not block unrelated pushes; it still shows as a failed step.
      - name: cargo-deny (advisories)
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev

      # Dependencies only (workspace crates always rebuild). Saved on pushes to the two branches
      # above; pull requests restore it.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-ci-linux
          save-if: ${{ github.event_name == 'push' }}

      # The pnpm version comes from `packageManager` in apps/desktop/package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      # The desktop crate embeds the built frontend, so this comes before clippy and the tests.
      - name: Desktop frontend build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Desktop frontend tests (vitest)
        working-directory: apps/desktop
        run: pnpm run --if-present test

      - name: cargo clippy (workspace)
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings

      # The e2e binaries and the fake llama-server only exist with this feature.
      - name: cargo clippy (nuggetd, fake-runtime)
        run: cargo clippy --locked -p nuggetd --features fake-runtime --all-targets -- -D warnings

      - name: cargo test (workspace)
        run: cargo test --locked --workspace
