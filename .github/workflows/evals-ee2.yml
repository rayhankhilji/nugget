name: Evals EE2 (temporary)

# TEMPORARY (EE2): before/after real-model runs for drafts that use the facts they need.
# "before" is the bench built at the integration commit EE2 started from, "after" this commit;
# each pair runs on one runner. Deleted before EE2's final push.

on:
  push:
    branches: [ee/draft-recall]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NUGGET_TRUST_DEV_MANIFEST_KEY: "1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"
  RUST_BACKTRACE: "1"
  BASE_REF: 4b98b901d49f808f9e28daeec5169d03ae7e4fbd
  NUGGET_BENCH_MODELS_HOME: ${{ github.workspace }}/bench/.local-models
  RESULTS: ${{ github.workspace }}/eval-results

jobs:
  ab:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          # Before and after on one runner: Qwen3-4B as in run 41007073954, grounded and
          # ungrounded arms and the baseline, temperature 0, rule-based judge.
          - suite: draft-ab
            base: true
            runs: |
              draft draft --local-chat-model qwen3-4b-q4km --draft-grounding both --draft-temperature 0 --draft-judge heuristic --scale standard
          # The 8B judge, one leg per runner (each judges Nugget against the baseline of its run).
          - suite: draft-judge-before
            base: true
            only_base: true
            runs: |
              draft draft --local-chat-model qwen3-4b-q4km --draft-grounding on --draft-temperature 0 --draft-judge model --draft-judge-model qwen3-8b-q4km --draft-judge-timeout-s 240 --scale standard
          - suite: draft-judge-after
            runs: |
              draft draft --local-chat-model qwen3-4b-q4km --draft-grounding on --draft-temperature 0 --draft-judge model --draft-judge-model qwen3-8b-q4km --draft-judge-timeout-s 240 --scale standard
          # Double Tap first inserted character, read-ahead on, before and after on one runner.
          - suite: doubletap-ab
            base: true
            runs: |
              4b-read-ahead-on doubletap --local-chat-model qwen3-4b-q4km --doubletap-read-ahead on --scale quick
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: evals

      - name: Cache models and runtime
        uses: actions/cache@v4
        with:
          path: bench/.local-models/data/models
          key: local-models-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('manifests/default.json') }}

      - name: Build the bench
        if: ${{ !matrix.only_base }}
        run: cargo build --release --locked -p nugget-bench

      - name: Build the bench at the base commit
        if: ${{ matrix.base }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          git worktree add --detach "$RUNNER_TEMP/base" FETCH_HEAD
          cargo build --release --locked -p nugget-bench \
            --manifest-path "$RUNNER_TEMP/base/Cargo.toml" --target-dir "$RUNNER_TEMP/base-target"

      - name: Record hardware
        run: |
          mkdir -p "$RESULTS"
          {
            echo "suite: ${{ matrix.suite }}"
            echo "runner: ${{ runner.name }} (${{ runner.os }} ${{ runner.arch }})"
            echo "commit: ${{ github.sha }} (base $BASE_REF)"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread|Flags' | cut -c1-160
            free -g
          } | tee "$RESULTS/hardware-${{ matrix.suite }}.txt"

      # Each run line: a label, then the bench arguments. With `base`, the base bench runs it
      # first into before/<label>/, then (unless `only_base`) this commit's into after/<label>/.
      - name: Run ${{ matrix.suite }}
        env:
          RUNS: ${{ matrix.runs }}
          BASE: ${{ matrix.base && '1' || '' }}
          ONLY_BASE: ${{ matrix.only_base && '1' || '' }}
        run: |
          failed=0
          while read -r -u 3 label args; do
            [ -n "$label" ] || continue
            if [ -n "$BASE" ]; then
              out="$RESULTS/before/$label"; mkdir -p "$out"
              echo "::group::before $label: $args"
              # shellcheck disable=SC2086
              if ! (cd "$RUNNER_TEMP/base" && "$RUNNER_TEMP/base-target/release/nugget-bench" $args \
                  --local-models --draft-dump "$out/drafts.jsonl" --out-dir "$out" < /dev/null); then
                echo "::warning::before $label failed"; failed=1
              fi
              echo "::endgroup::"
            fi
            if [ -z "$ONLY_BASE" ]; then
              out="$RESULTS/after/$label"; mkdir -p "$out"
              echo "::group::after $label: $args"
              # shellcheck disable=SC2086
              if ! ./target/release/nugget-bench $args --local-models \
                  --draft-dump "$out/drafts.jsonl" --out-dir "$out" < /dev/null; then
                echo "::warning::after $label failed"; failed=1
              fi
              echo "::endgroup::"
            fi
          done 3<<< "$RUNS"
          exit "$failed"

      - name: Summary
        if: always()
        run: |
          find "$RESULTS" -name '*.json' | sort | while read -r f; do
            echo "== $f"
            jq -c '{suite, status, message, duration_ms, git: .git_commit,
                    params: (.config.params | with_entries(select(.key | test("^(local|model|judge|tasks|items|draft|read_ahead|nugget)")))),
                    metrics: [.metrics[] | {name, value, unit, target, target_met}]}' "$f"
          done

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ee2-${{ matrix.suite }}
          path: |
            ${{ env.RESULTS }}
            bench/.local-models/data/logs
          if-no-files-found: warn
          retention-days: 30
