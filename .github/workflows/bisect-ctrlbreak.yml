name: Bisect CTRL_BREAK shutdown (temporary)

# TEMPORARY: the NSIS smoke step fails (nuggetd exits 0xC000013A on CTRL_BREAK without logging
# the signal) while a standalone nuggetd built from the same commits shuts down cleanly. This
# runs the real smoke script against the installers of an old green dry run and the failing one,
# on today's runner, to separate a code change from a runner change. Remove before merging.

on:
  push:
    branches: [ee/release-readiness]
    paths: [".github/workflows/bisect-ctrlbreak.yml"]

permissions:
  contents: read
  actions: read # download artifacts from earlier runs

jobs:
  smoke:
    name: smoke ${{ matrix.label }}
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: "13b305b (green dry run 40848720974)", run: "40848720974" }
          - { label: "eddd716 (failing dry run 41113647335)", run: "41113647335" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: bundle-x86_64-pc-windows-msvc
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bundle
      - name: Runner image
        shell: pwsh
        run: |
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
          [Environment]::OSVersion.VersionString
      - name: NSIS smoke test (current script)
        shell: pwsh
        env:
          SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke
        run: ./packaging/scripts/smoke-windows.ps1 (Get-ChildItem "$env:RUNNER_TEMP/bundle" -Filter '*-setup.exe')[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-${{ matrix.run }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore
          retention-days: 3
