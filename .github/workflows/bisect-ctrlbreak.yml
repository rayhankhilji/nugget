name: Bisect CTRL_BREAK shutdown (temporary)

# TEMPORARY: repeats the unchanged NSIS smoke against the installer of dry run 41245111121
# (nuggetd registers its stop signals at startup). Before the fix the step failed in about two
# of three runs. Remove before merging.

on:
  push:
    branches: [ee/release-readiness]
    paths: [".github/workflows/bisect-ctrlbreak.yml"]

permissions:
  contents: read
  actions: read # download artifacts from earlier runs

jobs:
  smoke:
    name: smoke ${{ matrix.n }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: bundle-x86_64-pc-windows-msvc
          run-id: "41245111121"
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bundle
      - name: NSIS smoke test (unchanged script)
        shell: pwsh
        env:
          SMOKE_ARTIFACTS: ${{ runner.temp }}/smoke
        run: ./packaging/scripts/smoke-windows.ps1 (Get-ChildItem "$env:RUNNER_TEMP/bundle" -Filter '*-setup.exe')[0].FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: smoke-${{ matrix.n }}
          path: ${{ runner.temp }}/smoke/
          if-no-files-found: ignore
          retention-days: 3
