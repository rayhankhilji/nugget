name: Bisect CTRL_BREAK shutdown (temporary)

# TEMPORARY diagnostics for the NSIS smoke failure (nuggetd exits 0xC000013A on CTRL_BREAK
# without logging the signal). Uses the installers of dry runs 40848720974 (13b305b) and
# 41113647335 (eddd716); nothing is rebuilt. Remove before merging.

on:
  push:
    branches: [ee/release-readiness]
    paths: [".github/workflows/bisect-ctrlbreak.yml"]

permissions:
  contents: read
  actions: read # download artifacts from earlier runs

jobs:
  smoke:
    name: smoke ${{ matrix.bundle }} ${{ matrix.n }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        bundle: [13b305b, eddd716]
        n: [1, 2, 3]
        include:
          - { bundle: 13b305b, run: "40848720974" }
          - { bundle: eddd716, run: "41113647335" }
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: bundle-x86_64-pc-windows-msvc
          run-id: ${{ matrix.run }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/bundle
      - name: NSIS smoke test (unchanged script)
        shell: pwsh
        run: ./packaging/scripts/smoke-windows.ps1 (Get-ChildItem "$env:RUNNER_TEMP/bundle" -Filter '*-setup.exe')[0].FullName
