name: QA GG6 (first week, three OSes)

# GG6 quality assurance (docs/qa/GG6.md): a new user's first week with the dry-run installers that
# release.yml builds, on GitHub's Windows, macOS and Linux runners. Each job installs the bundle,
# launches the app, goes through onboarding with a REAL local model download from the signed
# manifest, asks questions about a synthetic Documents folder, then simulates days 2-7 (restart,
# model server crash, suspend, idle overnight, a big folder, a full disk) and uninstalls,
# recording timings, screenshots and what is left behind. Scripts: qa/GG6/real-os/.

on:
  workflow_dispatch:
    inputs:
      release_run:
        description: "Run id of a release.yml dry run whose bundles to install"
        required: true
        type: string
      soak_minutes:
        description: "Idle minutes sampled for the overnight soak"
        default: "40"
        type: string

permissions:
  contents: read
  actions: read # download the bundles from the release dry run

env:
  RELEASE_RUN: ${{ inputs.release_run }}
  SOAK_MIN: ${{ inputs.soak_minutes }}
  GG6_OUT: ${{ github.workspace }}/gg6-out
  NO_COLOR: "1"

jobs:
  linux:
    name: Linux (deb + AppImage, x86_64)
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bundle-x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/bundle
          run-id: ${{ env.RELEASE_RUN }}
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Frontend and Playwright (for the bridge run)
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Hardware
        run: |
          mkdir -p "$GG6_OUT/native"
          { lscpu | grep -E 'Model name|^CPU\(s\)'; free -g; df -h "$HOME"; ls -l "$RUNNER_TEMP/bundle"; } | tee "$GG6_OUT/hardware.txt"
      - name: Install the .deb like a user (apt resolves dependencies)
        run: |
          deb=$(ls "$RUNNER_TEMP"/bundle/*.deb)
          start=$(date +%s.%N)
          sudo apt-get update -qq
          sudo apt-get install -y "$deb" 2>&1 | tail -n 25 | tee "$GG6_OUT/native/apt-install.txt"
          echo "install_s=$(echo "$(date +%s.%N) - $start" | bc)" | tee -a "$GG6_OUT/native/timings.txt"
          dpkg -L nugget | tee "$GG6_OUT/native/deb-files.txt"
          dpkg-deb -I "$deb" | tee "$GG6_OUT/native/deb-control.txt"
      - name: First launch of the installed app (Xvfb), screenshot, close
        run: |
          sudo apt-get install -y --no-install-recommends xvfb openbox wmctrl imagemagick dbus-x11 >/dev/null
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 >/dev/null 2>&1 &
          sleep 2; openbox >/dev/null 2>&1 &
          export WEBKIT_DISABLE_COMPOSITING_MODE=1 LIBGL_ALWAYS_SOFTWARE=1 HOME_BACKUP="$HOME"
          app=$(dpkg -L nugget | grep -E '/usr/bin/[^/]*desktop[^/]*$|/usr/bin/nugget$' | head -1)
          echo "app=$app"
          start=$(date +%s.%N)
          dbus-run-session -- "$app" > "$GG6_OUT/native/app.log" 2>&1 &
          for i in $(seq 1 120); do
            if wmctrl -l 2>/dev/null | grep -q Nugget; then break; fi; sleep 0.5
          done
          echo "window_s=$(echo "$(date +%s.%N) - $start" | bc)" | tee -a "$GG6_OUT/native/timings.txt"
          sleep 8
          import -window root "$GG6_OUT/native/first-launch.png" || true
          wmctrl -l | tee "$GG6_OUT/native/windows.txt"
          wmctrl -c Nugget || true
          sleep 8
          echo "--- still running after the window was closed:" | tee "$GG6_OUT/native/after-close.txt"
          ps -eo pid,rss,comm | grep -Ei 'nugget|llama' | tee -a "$GG6_OUT/native/after-close.txt" || true
          ls -la ~/.local/share/nugget ~/.config/nugget 2>&1 | tee "$GG6_OUT/native/data-after-first-launch.txt" || true
          pkill -f nugget-desktop || true; pkill -x nuggetd || true; sleep 2
          rm -rf ~/.local/share/nugget ~/.config/nugget ~/.cache/nugget
      - name: First week (installed nuggetd, real model, bridge UI)
        run: |
          nuggetd=$(dpkg -L nugget | grep -E '/nuggetd$' | head -1)
          echo "nuggetd=$nuggetd"
          node qa/GG6/real-os/run-bridge.mjs --nuggetd "$nuggetd" --soak-min "$SOAK_MIN"
      - name: Disk fills up during the model download (home on a 700 MB tmpfs)
        run: |
          mkdir -p "$RUNNER_TEMP/small"
          sudo mount -t tmpfs -o size=700m,uid=$(id -u) tmpfs "$RUNNER_TEMP/small"
          nuggetd=$(dpkg -L nugget | grep -E '/nuggetd$' | head -1)
          GG6_OUT="$GG6_OUT/diskfull" node qa/GG6/real-os/run-bridge.mjs --nuggetd "$nuggetd" --scenario diskfull --home "$RUNNER_TEMP/small/home"
          df -h "$RUNNER_TEMP/small" | tee "$GG6_OUT/diskfull/df.txt"
      - name: Uninstall (apt remove, then purge) and list what is left
        if: always()
        run: |
          pkill -x nuggetd || true
          { echo "== apt remove"; sudo apt-get remove -y nugget 2>&1 | tail -5
            echo "== after remove"; ls -d ~/.local/share/nugget ~/.config/nugget ~/.cache/nugget ~/.config/dev.nugget.desktop ~/.local/share/dev.nugget.desktop ~/.config/autostart/* ~/.config/systemd/user/nuggetd.service ~/"Nugget Vault" 2>&1
            echo "== apt purge"; sudo apt-get purge -y nugget 2>&1 | tail -5
            echo "== after purge"; ls -d ~/.local/share/nugget ~/.config/nugget ~/.cache/nugget ~/"Nugget Vault" 2>&1
            echo "== processes"; ps -eo pid,rss,comm | grep -Ei 'nugget|llama' || true
          } | tee "$GG6_OUT/native/uninstall.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg6-linux
          path: ${{ env.GG6_OUT }}
          retention-days: 30

  macos:
    name: macOS (dmg, Intel)
    runs-on: macos-15-intel
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bundle-x86_64-apple-darwin
          path: ${{ runner.temp }}/bundle
          run-id: ${{ env.RELEASE_RUN }}
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Frontend and Playwright (for the bridge run)
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install chromium
      - name: Hardware
        run: |
          mkdir -p "$GG6_OUT/native"
          { sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; sw_vers; df -h "$HOME"; ls -l "$RUNNER_TEMP/bundle"; } | tee "$GG6_OUT/hardware.txt"
      - name: Install from the dmg like a user (drag to Applications), Gatekeeper's view
        run: |
          dmg=$(ls "$RUNNER_TEMP"/bundle/*.dmg)
          start=$(date +%s)
          mnt=$(hdiutil attach -nobrowse "$dmg" | tail -1 | awk -F'\t' '{print $NF}')
          ls -la "$mnt" | tee "$GG6_OUT/native/dmg-contents.txt"
          cp -R "$mnt/Nugget.app" /Applications/
          hdiutil detach "$mnt" -quiet
          echo "install_s=$(( $(date +%s) - start ))" | tee -a "$GG6_OUT/native/timings.txt"
          # A browser download carries the quarantine flag; this is what Gatekeeper decides for it.
          xattr -w com.apple.quarantine "0083;$(printf %x $(date +%s));Safari;" /Applications/Nugget.app
          { echo "== spctl (quarantined, as downloaded)"; spctl --assess --type execute -vv /Applications/Nugget.app 2>&1 || true
            echo "== codesign"; codesign -dv /Applications/Nugget.app 2>&1 || true; } | tee "$GG6_OUT/native/gatekeeper.txt"
          xattr -dr com.apple.quarantine /Applications/Nugget.app
      - name: First launch of the installed app, screenshot, quit
        run: |
          start=$(date +%s)
          open -a /Applications/Nugget.app
          for i in $(seq 1 120); do
            n=$(osascript -e 'tell application "System Events" to count windows of (first process whose name is "Nugget")' 2>/dev/null || echo 0)
            [ "${n:-0}" -gt 0 ] && break; sleep 0.5
          done
          echo "window_s=$(( $(date +%s) - start ))" | tee -a "$GG6_OUT/native/timings.txt"
          sleep 8
          screencapture -x "$GG6_OUT/native/first-launch.png" || true
          # What the accessibility tree exposes of the onboarding (buttons a screen reader user meets).
          osascript -e 'tell application "System Events" to get {role description, name, description} of every UI element of entire contents of window 1 of (first process whose name is "Nugget") whose role is "AXButton"' > "$GG6_OUT/native/ax-buttons.txt" 2>&1 || true
          osascript -e 'tell application "Nugget" to quit' || true
          sleep 10
          { echo "--- still running after Quit:"; pgrep -lf 'nuggetd|llama-server|Nugget' || true; } | tee "$GG6_OUT/native/after-quit.txt"
          pkill -x nuggetd || true; sleep 2
          ls -la ~/Library/LaunchAgents 2>&1 | tee "$GG6_OUT/native/launchagents.txt" || true
          rm -rf ~/Library/Application\ Support/dev.Nugget.Nugget ~/Library/Caches/dev.Nugget.Nugget
      - name: First week (installed nuggetd, real model, bridge UI)
        run: node qa/GG6/real-os/run-bridge.mjs --nuggetd /Applications/Nugget.app/Contents/MacOS/nuggetd --soak-min "$SOAK_MIN"
      - name: Uninstall (drag to Trash) and list what is left
        if: always()
        run: |
          pkill -x nuggetd || true
          rm -rf /Applications/Nugget.app
          { ls -d ~/Library/Application\ Support/dev.Nugget.Nugget ~/Library/Application\ Support/dev.nugget.desktop ~/Library/Caches/dev.Nugget.Nugget ~/Library/LaunchAgents/*nugget* ~/"Nugget Vault" 2>&1
            security find-generic-password -s dev.nugget.Nugget 2>&1 | head -5
            pgrep -lf 'nuggetd|llama-server' || true; } | tee "$GG6_OUT/native/uninstall.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg6-macos
          path: ${{ env.GG6_OUT }}
          retention-days: 30

  windows:
    name: Windows (NSIS + MSI, x64)
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: bundle-x86_64-pc-windows-msvc
          path: ${{ runner.temp }}/bundle
          run-id: ${{ env.RELEASE_RUN }}
          github-token: ${{ github.token }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/desktop/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Playwright (connects to the app's own WebView2)
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Hardware and installer signature
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GG6_OUT/native" | Out-Null
          $o = "$env:GG6_OUT/hardware.txt"
          Get-CimInstance Win32_Processor | Select-Object Name,NumberOfLogicalProcessors | Out-String | Tee-Object -FilePath $o
          "RAM GB: " + [math]::Round((Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory/1GB) | Tee-Object -FilePath $o -Append
          Get-ChildItem "$env:RUNNER_TEMP/bundle" | Format-Table Name,Length | Out-String | Tee-Object -FilePath $o -Append
          Get-ChildItem "$env:RUNNER_TEMP/bundle" -Include *.exe,*.msi -Recurse | ForEach-Object { Get-AuthenticodeSignature $_.FullName } |
            Format-List Path,Status,StatusMessage | Out-String | Tee-Object -FilePath "$env:GG6_OUT/native/signature.txt"
      - name: Install with the NSIS installer (silent, per user)
        shell: pwsh
        run: |
          $setup = (Get-ChildItem "$env:RUNNER_TEMP/bundle" -Filter '*-setup.exe')[0].FullName
          $t = [Diagnostics.Stopwatch]::StartNew()
          Start-Process -Wait -FilePath $setup -ArgumentList '/S'
          "install_s=$($t.Elapsed.TotalSeconds)" | Tee-Object -FilePath "$env:GG6_OUT/native/timings.txt" -Append
          # Where NSIS put it: the uninstall entry it registers (per-user install).
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.GetValue('DisplayName') -like '*Nugget*' } | Select-Object -First 1
          $un = $entry.GetValue('UninstallString') -replace '"', ''
          $dir = Split-Path $un
          "uninstall entry: $($entry.Name) -> $un" | Tee-Object -FilePath "$env:GG6_OUT/native/install-location.txt"
          $app = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notin @('nuggetd.exe', 'uninstall.exe') } | Select-Object -First 1
          if (-not $app) { Get-ChildItem $dir | Out-String | Write-Host; throw "no app executable in $dir" }
          "APP=$($app.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "app: $($app.FullName)" | Tee-Object -FilePath "$env:GG6_OUT/native/install-location.txt" -Append
          Get-ChildItem (Split-Path $app.FullName) | Format-Table Name,Length | Out-String | Tee-Object -FilePath "$env:GG6_OUT/native/install-dir.txt"
          Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | Where-Object { $_.GetValue('DisplayName') -like '*Nugget*' } |
            ForEach-Object { $_.GetValue('DisplayName') + ' | ' + $_.GetValue('UninstallString') } | Tee-Object -FilePath "$env:GG6_OUT/native/uninstall-entry.txt"
      - name: First week in the installed app (real model)
        shell: pwsh
        timeout-minutes: 200
        run: node qa/GG6/real-os/run-win-app.mjs --app "$env:APP" --soak-min "$env:SOAK_MIN"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg6-windows-journey
          path: ${{ env.GG6_OUT }}
          retention-days: 30
      - name: Screenshot of the desktop (tray area)
        if: always()
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms,System.Drawing
          $b = [Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
          [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$env:GG6_OUT/native/desktop.png")
      - name: Uninstall (NSIS, silent) and list what is left
        if: always()
        timeout-minutes: 10
        shell: pwsh
        run: |
          $o = "$env:GG6_OUT/native/uninstall.txt"
          "== running before uninstall" | Tee-Object -FilePath $o
          Get-Process nuggetd,llama-server,nugget-desktop -ErrorAction SilentlyContinue | Format-Table Id,ProcessName,WorkingSet64 | Out-String | Tee-Object -FilePath $o -Append
          $un = Get-ChildItem (Split-Path $env:APP) -Filter 'uninstall.exe' | Select-Object -First 1
          $t = [Diagnostics.Stopwatch]::StartNew()
          Start-Process -Wait -FilePath $un.FullName -ArgumentList '/S'
          Start-Sleep 5
          "uninstall_s=$($t.Elapsed.TotalSeconds)" | Tee-Object -FilePath $o -Append
          "== running after uninstall" | Tee-Object -FilePath $o -Append
          Get-Process nuggetd,llama-server,nugget-desktop -ErrorAction SilentlyContinue | Format-Table Id,ProcessName | Out-String | Tee-Object -FilePath $o -Append
          "== left on disk" | Tee-Object -FilePath $o -Append
          foreach ($p in @("$env:LOCALAPPDATA\Nugget", "$env:LOCALAPPDATA\Nugget\Nugget\data", "$env:LOCALAPPDATA\Nugget\Nugget\data\models", "$env:APPDATA\Nugget", "$env:APPDATA\dev.nugget.desktop", "$env:LOCALAPPDATA\dev.nugget.desktop", "$env:USERPROFILE\Nugget Vault")) {
            if (Test-Path $p) { $mb = [math]::Round(((Get-ChildItem $p -Recurse -File -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum)/1MB); "LEFT $p ($mb MB)" } else { "gone $p" }
          } | Tee-Object -FilePath $o -Append
          "== Run key" | Tee-Object -FilePath $o -Append
          (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue | Out-String) | Tee-Object -FilePath $o -Append
          "== scheduled task" | Tee-Object -FilePath $o -Append
          (schtasks /Query /TN "Nugget Daemon" 2>&1 | Out-String) | Tee-Object -FilePath $o -Append
          "== credentials" | Tee-Object -FilePath $o -Append
          (cmdkey /list | Select-String -Pattern nugget | Out-String) | Tee-Object -FilePath $o -Append
      - name: MSI install, launch, uninstall (what the MSI leaves)
        if: always()
        timeout-minutes: 15
        shell: pwsh
        run: |
          $o = "$env:GG6_OUT/native/msi.txt"
          $msi = (Get-ChildItem "$env:RUNNER_TEMP/bundle" -Filter '*.msi')[0].FullName
          $p = Start-Process -Wait -PassThru msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi-install.log`""
          "install exit $($p.ExitCode)" | Tee-Object -FilePath $o
          $app = Get-ChildItem "$env:ProgramFiles\Nugget" -Filter 'nugget-desktop.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          "app: $($app.FullName)" | Tee-Object -FilePath $o -Append
          if ($app) { Start-Process $app.FullName; Start-Sleep 40 }
          Get-Process nuggetd,nugget-desktop -ErrorAction SilentlyContinue | Format-Table Id,ProcessName,Path | Out-String | Tee-Object -FilePath $o -Append
          $p = Start-Process -Wait -PassThru msiexec -ArgumentList "/x `"$msi`" /qn /l*v `"$env:RUNNER_TEMP\msi-uninstall.log`""
          "uninstall exit $($p.ExitCode) (1603 fatal, 3010 reboot needed, 1641 rebooting)" | Tee-Object -FilePath $o -Append
          "== running after MSI uninstall" | Tee-Object -FilePath $o -Append
          Get-Process nuggetd,nugget-desktop -ErrorAction SilentlyContinue | Format-Table Id,ProcessName,Path | Out-String | Tee-Object -FilePath $o -Append
          "== files left in Program Files" | Tee-Object -FilePath $o -Append
          (Get-ChildItem "$env:ProgramFiles\Nugget" -ErrorAction SilentlyContinue | Out-String) | Tee-Object -FilePath $o -Append
          (Select-String -Path "$env:RUNNER_TEMP\msi-uninstall.log" -Pattern 'in use|RestartManager|1603|reboot' | Select-Object -First 20 | Out-String) | Tee-Object -FilePath $o -Append
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gg6-windows
          path: ${{ env.GG6_OUT }}
          retention-days: 30
