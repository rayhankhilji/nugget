name: Release rehearsal

# A complete release, end to end, with THROWAWAY keys, proving everything short of the
# maintainers' real keys works:
#
# - generates a throwaway updater (minisign) key and a throwaway model-manifest release key
#   (ed25519) in the job, plus a second "wrong" key of each kind;
# - signs manifests/default.json with the throwaway release key (job workspace only) and builds
#   nuggetd trusting only that key, like a real release; checks that it accepts the manifest and
#   that a nuggetd built with the wrong key rejects it;
# - builds the app twice, an OLD and a NEW version (both `-rehearsal`), with the throwaway updater
#   key and a feed on https://localhost baked in;
# - signs the new build's update payload and the feed exactly as release.yml's `sign` and
#   `channels` jobs do for a prerelease (promote, then the beta channel; packaging/scripts/
#   updater_manifest.py, `tauri signer sign`); the installed apps follow the beta channel;
# - serves the feed over HTTPS from 127.0.0.1 (a throwaway local CA, trusted by the runner for
#   the job only) and lets the installed OLD app find, verify and install the NEW one;
# - checks that a feed signed with the wrong key, and a payload signed with the wrong key, are
#   refused and install nothing.
#
# Coverage: Linux x64 (AppImage) and Windows x64 (NSIS). macOS is out of scope (no notarized
# builds without the real Apple credentials; its updater path is the same plugin code).
#
# Nothing here is publishable: no environment, no secret, no `gh release`, no attestation; the
# private keys exist only in $RUNNER_TEMP for the job and are never uploaded (the report step
# fails if the evidence contains any); installers are not uploaded. The evidence (a PASS/FAIL
# report, public keys, SHA256SUMS, feeds and signatures, app/daemon/server logs) is uploaded as
# `rehearsal-evidence-<os>` and shown in the job summary.
#
# Run it: Actions -> Release rehearsal -> Run workflow (any branch), or
#   gh workflow run release-rehearsal.yml --ref <branch>
# Scripts: packaging/scripts/rehearsal/.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  RUSTUP_MAX_RETRIES: "10"

jobs:
  linux:
    name: Rehearsal (Linux x64, AppImage)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      TARGET: x86_64-unknown-linux-gnu
      # Strictly increasing, and marked: these builds can never pass for a release.
      REHEARSAL_OLD_VERSION: 0.9.0-rehearsal.1
      REHEARSAL_NEW_VERSION: 0.9.1-rehearsal.1
      REHEARSAL_PORT: "47443"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # State for every later step (keys, builds, feeds, evidence); see common.sh.
      - name: Rehearsal directory
        shell: bash
        run: echo "REHEARSAL_DIR=$RUNNER_TEMP/rehearsal" >> "$GITHUB_ENV"

      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file rpm xdg-utils \
            libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev \
            xvfb openbox wmctrl xdotool dbus-x11

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"

      # A cache is fine here: nothing this workflow builds is released.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-rehearsal-${{ env.TARGET }}
          cache-on-failure: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Generate throwaway keys
        run: packaging/scripts/rehearsal/prepare.sh keys

      - name: Sign the model manifest with the throwaway release key
        run: packaging/scripts/rehearsal/prepare.sh manifest

      - name: Build nuggetd (wrong manifest key, then the throwaway release key)
        run: packaging/scripts/rehearsal/prepare.sh sidecar --wrong

      - name: Build the old version
        run: packaging/scripts/rehearsal/prepare.sh build old

      - name: Build the new version
        run: packaging/scripts/rehearsal/prepare.sh build new

      - name: Sign the update and the feed (as release.yml does)
        run: packaging/scripts/rehearsal/prepare.sh sign

      # TEST ONLY: a throwaway CA for the HTTPS localhost feed, trusted until the end of the job.
      - name: Trust a throwaway localhost CA (test only)
        run: |
          packaging/scripts/rehearsal/make-ca.sh "$REHEARSAL_DIR/tls"
          packaging/scripts/rehearsal/trust-ca.sh add "$REHEARSAL_DIR/tls/ca.crt"

      - name: End-to-end checks
        run: packaging/scripts/rehearsal/e2e-linux.sh

      - name: Remove the throwaway CA
        if: always()
        run: packaging/scripts/rehearsal/trust-ca.sh remove

      - name: Report
        if: always()
        run: |
          python3 -I packaging/scripts/rehearsal/report.py --evidence "$REHEARSAL_DIR/evidence" \
            --keys "$REHEARSAL_DIR/keys" --os linux-x64 \
            --old "$REHEARSAL_OLD_VERSION" --new "$REHEARSAL_NEW_VERSION"

      - name: Destroy the throwaway keys
        if: always()
        run: rm -rf "$REHEARSAL_DIR/keys" "$REHEARSAL_DIR/tls"

      # Public material and logs only (no keys, no installers).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rehearsal-evidence-linux-x64
          path: ${{ runner.temp }}/rehearsal/evidence/
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Rehearsal (Windows x64, NSIS)
    runs-on: windows-2022
    permissions:
      contents: read
    timeout-minutes: 150
    env:
      TARGET: x86_64-pc-windows-msvc
      # Strictly increasing, and marked: these builds can never pass for a release.
      REHEARSAL_OLD_VERSION: 0.9.0-rehearsal.1
      REHEARSAL_NEW_VERSION: 0.9.1-rehearsal.1
      REHEARSAL_PORT: "47443"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # State for every later step (keys, builds, feeds, evidence); see common.sh.
      - name: Rehearsal directory
        shell: bash
        run: echo "REHEARSAL_DIR=$RUNNER_TEMP/rehearsal" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add "$TARGET"

      - name: Use Strawberry Perl for vendored OpenSSL
        shell: pwsh
        run: |
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (Test-Path $perl) { "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release-rehearsal-${{ env.TARGET }}
          cache-on-failure: true

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: apps/desktop/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Generate throwaway keys
        run: packaging/scripts/rehearsal/prepare.sh keys

      - name: Sign the model manifest with the throwaway release key
        run: packaging/scripts/rehearsal/prepare.sh manifest

      - name: Build nuggetd (throwaway release key)
        run: packaging/scripts/rehearsal/prepare.sh sidecar

      - name: Build the old version
        run: packaging/scripts/rehearsal/prepare.sh build old

      - name: Build the new version
        run: packaging/scripts/rehearsal/prepare.sh build new

      - name: Sign the update and the feed (as release.yml does)
        run: packaging/scripts/rehearsal/prepare.sh sign

      - name: Make a throwaway localhost CA
        run: packaging/scripts/rehearsal/make-ca.sh "$REHEARSAL_DIR/tls"

      # TEST ONLY: trusted by the machine until the "Remove" step below. Its private key no longer
      # exists (make-ca.sh deletes it after signing the one localhost certificate).
      - name: Trust the throwaway CA (test only)
        shell: pwsh
        run: |
          $ca = Join-Path $env:REHEARSAL_DIR 'tls\ca.crt'
          $cert = Import-Certificate -FilePath $ca -CertStoreLocation Cert:\LocalMachine\Root
          $cert.Thumbprint | Out-File -FilePath (Join-Path $env:REHEARSAL_DIR 'ca.thumbprint') -Encoding ascii
          Write-Output "trusted $($cert.Subject) ($($cert.Thumbprint))"

      - name: End-to-end checks
        shell: pwsh
        run: |
          ./packaging/scripts/rehearsal/e2e-windows.ps1 -RehearsalDir $env:REHEARSAL_DIR `
            -OldVersion $env:REHEARSAL_OLD_VERSION -NewVersion $env:REHEARSAL_NEW_VERSION -Port $env:REHEARSAL_PORT

      - name: Remove the throwaway CA
        if: always()
        shell: pwsh
        run: |
          $f = Join-Path $env:REHEARSAL_DIR 'ca.thumbprint'
          if (Test-Path $f) {
            $t = (Get-Content $f -Raw).Trim()
            Get-ChildItem Cert:\LocalMachine\Root | Where-Object Thumbprint -eq $t | Remove-Item
            Write-Output "removed $t"
          }

      - name: Report
        if: always()
        run: |
          python3 -I packaging/scripts/rehearsal/report.py --evidence "$REHEARSAL_DIR/evidence" \
            --keys "$REHEARSAL_DIR/keys" --os windows-x64 \
            --old "$REHEARSAL_OLD_VERSION" --new "$REHEARSAL_NEW_VERSION"

      - name: Destroy the throwaway keys
        if: always()
        run: rm -rf "$REHEARSAL_DIR/keys" "$REHEARSAL_DIR/tls"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rehearsal-evidence-windows-x64
          path: ${{ runner.temp }}/rehearsal/evidence/
          if-no-files-found: warn
          retention-days: 14
