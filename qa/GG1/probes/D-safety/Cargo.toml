# GG1 area D (safety) probe: drives nugget_draft's PostProcessor + Grounder directly with
# adversarial streams (both GroundingCheck modes), the way the engine's pump chains them.
# Its own workspace, so it never touches the product workspace.
[package]
name = "gg1-probe-safety"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[[bin]]
name = "gg1-probe-safety"
path = "src/main.rs"

[dependencies]
nugget-core = { path = "../../../../crates/nugget-core" }
nugget-draft = { path = "../../../../crates/nugget-draft" }
nugget-voice = { path = "../../../../crates/nugget-voice" }
serde_json = "1"
