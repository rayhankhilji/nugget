# GG1 area E probe: insertion (nugget-a11y Backend over a scripted platform) and read-ahead
# (nugget-draft Drafter with the product's default read-ahead config). Its own workspace.
[package]
name = "gg1-probe-e-insert"
version = "0.0.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[workspace]

[[bin]]
name = "gg1-probe-e-insert"
path = "src/main.rs"

[dependencies]
nugget-a11y = { path = "../../../../crates/nugget-a11y" }
nugget-core = { path = "../../../../crates/nugget-core" }
nugget-draft = { path = "../../../../crates/nugget-draft" }
nugget-infer = { path = "../../../../crates/nugget-infer" }
nugget-retrieve = { path = "../../../../crates/nugget-retrieve" }
nugget-store = { path = "../../../../crates/nugget-store" }
async-trait = "0.1"
futures = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
