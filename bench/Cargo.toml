[package]
name = "nugget-bench"
description = "Benchmark harness for Nugget: memory, perf, draft and computer-use suites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nugget-bench"
path = "src/main.rs"

[dependencies]
nugget-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
# `memory --backend real`: the real stack, in process.
nugget-store.workspace = true
nugget-retrieve.workspace = true
nugget-ingest.workspace = true
nugget-connector.workspace = true
nugget-connector-files.workspace = true
nugget-infer.workspace = true
tokio.workspace = true
# Temporary NUGGET_HOME and watched folder for the real backend.
tempfile = "3"
# `draft`: contract types of the drafting and voice crates, token estimates, provider streams.
nugget-draft.workspace = true
nugget-voice.workspace = true
nugget-extract.workspace = true
futures.workspace = true

[dev-dependencies]
# `draft` against a mocked OpenAI-compatible provider.
wiremock = "0.6"

[lints]
workspace = true
