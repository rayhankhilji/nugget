[package]
name = "nugget-bench"
description = "Benchmark harness for Nugget: memory, perf, knowledge, draft and computer-use suites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "nugget-bench"
path = "src/main.rs"

[dependencies]
nugget-core.workspace = true
# `cua`: the action descriptor and risk classes agents confirm with.
nugget-policy.workspace = true
# `cua --cua-agent nugget`: the real agent loop, its computer-use tools, and the contract the
# bench session implements for them.
nugget-agent.workspace = true
nugget-a11y.workspace = true
nugget-computer.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
clap = { version = "4.5", features = ["derive", "env"] }
# `memory --backend real`: the real stack, in process.
nugget-store.workspace = true
nugget-retrieve.workspace = true
nugget-ingest.workspace = true
nugget-connector.workspace = true
nugget-connector-files.workspace = true
nugget-infer.workspace = true
tokio.workspace = true
# `perf --backend real`: drives the `nuggetd` binary over its IPC (see src/suites/perf_daemon.rs).
nugget-ipc.workspace = true
# Temporary NUGGET_HOME and watched folder for the real backend.
tempfile = "3"
# `draft`: contract types of the drafting and voice crates, token estimates, provider streams.
nugget-draft.workspace = true
nugget-voice.workspace = true
nugget-extract.workspace = true
futures.workspace = true

# `knowledge`: graph contract, ingest-equivalent extraction, the scripted fake LLM provider.
nugget-graph.workspace = true
async-trait.workspace = true
# `knowledge`: the pipeline under test (feature `pipeline`, see src/knowledge/wired.rs).
nugget-knowledge = { workspace = true, optional = true }
nugget-vault = { workspace = true, optional = true }
nugget-mcp = { workspace = true, optional = true }
# `proactive --backend real`: the proactive engine under test.
nugget-proactive.workspace = true
# `--local-models`: the signed manifest, model store and llama-server supervisor the app uses.
nugget-models.workspace = true
nugget-runtime.workspace = true
# `ask`: the daemon's answer prompt and streaming post-check (`nuggetd::ask`), not a copy.
nuggetd = { path = "../crates/nuggetd" }

[dev-dependencies]
# `draft` against a mocked OpenAI-compatible provider.
wiremock = "0.6"

[features]
default = ["pipeline"]
# The M2 knowledge pipeline for the `knowledge` suite. Without it the suite reports
# `not_implemented` (an escape hatch while those crates change).
pipeline = ["dep:nugget-knowledge", "dep:nugget-vault", "dep:nugget-mcp"]

[lints]
workspace = true
