[package]
name = "nugget-desktop"
description = "Nugget desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "nugget-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nugget-core.workspace = true
nugget-ipc.workspace = true
# W1 Double Tap: the global trigger and the accessibility read/insert (`src/doubletap/`).
nugget-hotkey.workspace = true
nugget-a11y.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
# Rust-side APIs only: no plugin command is granted to the webview (see capabilities/default.json).
# Pinned to the last releases on the Tauri 2.11 line (newer ones need tauri 2.12 and Rust 1.90).
tauri-plugin-opener = "=2.5.5"
tauri-plugin-dialog = "=2.7.3"
# Signed self-update (minisign). 2.12.0 is the last release that accepts tauri 2.11 and Rust 1.88;
# 2.13+ needs tauri 2.12 and Rust 1.90. Driven only from Rust (`updater.rs`), never the webview.
tauri-plugin-updater = "=2.12.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints]
workspace = true
