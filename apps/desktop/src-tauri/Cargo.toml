[package]
name = "nugget-desktop"
description = "Nugget desktop shell (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
default-run = "nugget-desktop"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nugget-core.workspace = true
nugget-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
futures.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
# Rust-side APIs only: no plugin command is granted to the webview (see capabilities/default.json).
# Pinned to the last releases on the Tauri 2.11 line (newer ones need tauri 2.12 and Rust 1.90).
tauri-plugin-opener = "=2.5.5"
tauri-plugin-dialog = "=2.7.3"
# Signed self-update (minisign). 2.12.0 is the last release that accepts tauri 2.11 and Rust 1.88;
# 2.13+ needs tauri 2.12 and Rust 1.90. Driven only from Rust (`updater.rs`), never the webview.
tauri-plugin-updater = "=2.12.0"
# OS notifications (morning brief, reminders), shown from Rust (`commands::notify`) only. 2.4.0 is
# the last release that accepts tauri 2.11 and Rust 1.88.
tauri-plugin-notification = "=2.4.0"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
# A second launch focuses the running window. 2.4.5 is the last release that accepts tauri 2.11
# and Rust 1.88 (MSRV 1.77.2); 2.5+ needs tauri 2.12 and Rust 1.90.
tauri-plugin-single-instance = "=2.4.5"

[target.'cfg(target_os = "linux")'.dependencies]
# Asks the session bus whether a StatusNotifier host exists before creating the tray (tray.rs).
# Same major version the single-instance plugin already pulls in on Linux.
zbus = "5.9"

[lints]
workspace = true
